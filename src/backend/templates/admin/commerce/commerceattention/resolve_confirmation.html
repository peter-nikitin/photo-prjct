{% extends "admin/base_site.html" %}

{% block content %}
  <h1>Разрешить обращение</h1>
  <form method="post">
    {% csrf_token %}
    <input type="hidden" name="action" value="{{ action_name }}">
    <input type="hidden" name="confirm_attention_resolution" value="yes">
    {% for attention in queryset %}
      <input type="hidden" name="_selected_action" value="{{ attention.pk }}">
    {% endfor %}
    {% if comment_error %}
      <p class="errornote">Нужен комментарий к разрешению.</p>
    {% endif %}
    <p>
      <label for="id_resolution_comment">Комментарий к разрешению</label>
      <textarea id="id_resolution_comment" name="resolution_comment" required>{{ resolution_comment }}</textarea>
    </p>
    <button type="submit">Разрешить обращение</button>
  </form>
{% endblock %}
