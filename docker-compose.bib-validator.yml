services:
  bib-validator:
    image: ${BIB_VALIDATOR_IMAGE:-findme-bib-validator:local}
    build:
      context: .
      dockerfile: Dockerfile.bib-validator
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8180/health', timeout=2).close()"]
      interval: 5s
      timeout: 3s
      retries: 30
    networks: [bib-validation]
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    cpus: "2"
    mem_limit: 3g
    pids_limit: 64
    restart: unless-stopped

networks:
  bib-validation:
    internal: true
