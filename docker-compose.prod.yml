services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: ${DB_NAME:-app}
      POSTGRES_USER: ${DB_USER:-app}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-app}
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-app} -d ${DB_NAME:-app}"]
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    image: ${APP_IMAGE:?APP_IMAGE must be set}
    env_file:
      - ${APP_ENV_FILE:-.env}
    expose:
      - "8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import urllib.request;
          urllib.request.urlopen('http://localhost:8000/health/', timeout=3)
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s
    restart: unless-stopped

  worker:
    image: ${WORKER_IMAGE:-}
    profiles:
      - worker
    environment:
      PHOTO_WORKER_API_URL: http://web:8000/internal/photo-processing/v1
      PHOTO_WORKER_TOKEN: ${PHOTO_PROCESSING_WORKER_TOKEN:-}
      PHOTO_WORKER_BUILD: ${PHOTO_WORKER_BUILD:-capture-metadata-v1}
      PHOTO_WORKER_LEASE_SECONDS: ${PHOTO_WORKER_LEASE_SECONDS:-120}
      PHOTO_WORKER_PROCESSOR_IDENTITIES: ${PHOTO_WORKER_PROCESSOR_IDENTITIES:-1/capture_metadata/1,1/face_embedding/1,2/generate_preview/1,2/face_embedding/2}
      PHOTO_WORKER_PROCESSOR_TYPES: ${PHOTO_WORKER_PROCESSOR_TYPES:-selfie_query,face_embedding,capture_metadata,generate_preview}
    depends_on:
      web:
        condition: service_healthy
    restart: unless-stopped
    cpus: "1.0"
    mem_limit: 768m
    pids_limit: 64

volumes:
  pgdata:
