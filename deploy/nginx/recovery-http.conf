server_tokens off;

log_format recovery_safe '$status $body_bytes_sent $request_time';
access_log /dev/stdout recovery_safe;
error_log /dev/null crit;

server {
    listen 8080 default_server;
    server_name _;
    client_max_body_size 25m;

    location = /admin { return 404; }
    location ^~ /admin/ { return 404; }
    location = /photographer { return 404; }
    location ^~ /photographer/ { return 404; }

    location ^~ /internal/ {
        return 404;
    }

    location ^~ /static/ {
        alias /static/;
        add_header X-Content-Type-Options "nosniff" always;
    }

    location = /_authorize_image {
        internal;
        proxy_pass http://web:8000/internal/gallery-token/;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Host web;
        proxy_set_header X-FindMe-Image-Uri $request_uri;
    }

    location ~ "^/[A-Za-z0-9_-]{43}/(?:gallery-v1|cover-v1)/[A-Za-z0-9_-]{1,768}\.jpg$" {
        if ($request_method !~ ^(GET|HEAD)$) { return 405; }
        auth_request /_authorize_image;
        proxy_pass_request_headers off;
        proxy_pass_request_body off;
        proxy_set_header Host imgproxy;
        proxy_set_header Accept image/jpeg;
        proxy_hide_header Cache-Control;
        add_header Cache-Control "private, no-store" always;
        add_header X-Content-Type-Options "nosniff" always;
        proxy_pass http://imgproxy:8080$uri;
    }

    location / {
        if ($request_method !~ ^(GET|HEAD)$) { return 405; }
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto http;
        proxy_pass http://web:8000;
    }
}
