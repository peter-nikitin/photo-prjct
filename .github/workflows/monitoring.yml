name: Monitoring
on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize]
  push:
    branches: [main]
  workflow_run:
    workflows: [Infrastructure, Deploy]
    types: [completed]
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: findme-monitoring-production
  cancel-in-progress: false
jobs:
  classify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    outputs:
      cloud_changed: ${{ steps.select.outputs.cloud_changed }}
      collector_changed: ${{ steps.select.outputs.collector_changed }}
      application_changed: ${{ steps.select.outputs.application_changed }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Classify single VM monitoring inputs or completed release
        id: select
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          set -eu
          case "$EVENT_NAME" in
            push|pull_request)
              python deploy/classify-release.py --observability --base "$BASE" --head "$HEAD" >> "$GITHUB_OUTPUT"
              ;;
            workflow_run)
              # A completed source release is a readiness signal; GitHub does not expose its push base here.
              # Recheck freshness after trusted releases; an unchanged dashboard is never rewritten.
              python deploy/classify-release.py --monitoring-release-event >> "$GITHUB_OUTPUT"
              ;;
            workflow_dispatch)
              printf '%s\n' 'cloud_changed=true' >> "$GITHUB_OUTPUT"
              ;;
          esac
  validate:
    needs: classify
    if: >-
      needs.classify.outputs.cloud_changed == 'true' ||
      needs.classify.outputs.collector_changed == 'true' ||
      needs.classify.outputs.application_changed == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          python -m venv /tmp/monitoring-tools
          /tmp/monitoring-tools/bin/pip install -r deploy/monitoring/prometheus/requirements.txt
          cat > /tmp/promtool <<'SCRIPT'
          #!/bin/sh
          exec docker run --rm --entrypoint promtool -v "$PWD:$PWD" -w "$PWD" prom/prometheus:v3.5.0 "$@"
          SCRIPT
          chmod +x /tmp/promtool
          /tmp/monitoring-tools/bin/python deploy/monitoring/prometheus/single_vm_dashboard.py --validate --promtool /tmp/promtool
  reconcile:
    needs: [classify, validate]
    if: >-
      github.ref == 'refs/heads/main' && github.event_name != 'pull_request' &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event_name == 'push' && needs.classify.outputs.cloud_changed == 'true' &&
        needs.classify.outputs.collector_changed != 'true' &&
        needs.classify.outputs.application_changed != 'true') ||
       (github.event_name == 'workflow_run' &&
        (needs.classify.outputs.collector_changed == 'true' ||
         needs.classify.outputs.application_changed == 'true')))
    runs-on: ubuntu-latest
    environment: monitoring
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          python -m venv /tmp/monitoring-tools
          /tmp/monitoring-tools/bin/pip install -r deploy/monitoring/prometheus/requirements.txt
          /tmp/monitoring-tools/bin/python deploy/monitoring/prometheus/single_vm_dashboard.py \
            --oidc-config deploy/monitoring/prometheus/oidc.json --backup "$PWD/monitoring-backup"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: monitoring-dashboard-backup-${{ github.run_id }}
          path: monitoring-backup
          if-no-files-found: ignore
