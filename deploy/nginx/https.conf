server_tokens off;
error_log /dev/null crit;
map $uri $safe_request {
    default $request;
    ~^/events/[^/]+/selfie-search(?:/|$) "$request_method <selfie-search>";
    ~^/orders/[^/]+/access/[^/]+/[^/]+(?:/|$) "$request_method <order-access>";
    ~^/orders/[^/]+/download/$ "$request_method <order-archive>";
}
map $uri $safe_address {
    default $remote_addr;
    ~^/events/[^/]+/selfie-search(?:/|$) "-";
    ~^/orders/[^/]+/access/[^/]+/[^/]+(?:/|$) "-";
    ~^/orders/[^/]+/download/$ "-";
}
log_format safe '$safe_address - - [$time_local] "$safe_request" $status $body_bytes_sent';
limit_req_zone $binary_remote_addr zone=web_vitals_ip:1m rate=2r/s;
limit_req_zone $server_name zone=web_vitals_global:1m rate=50r/s;
server {
    listen 80 default_server;
    server_name _;
    access_log /var/log/nginx/access.log safe;
    error_log /dev/null emerg;
    location ^~ /.well-known/acme-challenge/ { root /var/www/certbot; }
    location ^~ /internal/ { return 404; }
    location = /metrics/ { return 404; }
    location = /telemetry/web-vitals/ { access_log off; return 404; }
    location ^~ /worker-diagnostics/ { return 404; }
    location / {
        add_header Cache-Control "private, no-store" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Vary "Cookie" always;
        return 308 https://findme-photo.ru$request_uri;
    }
}
server {
    listen 443 ssl default_server;
    server_name _;
    access_log /var/log/nginx/access.log safe;
    ssl_certificate /etc/letsencrypt/live/photo-prjct/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/photo-prjct/privkey.pem;
    return 444;
}
server {
    listen 443 ssl;
    server_name www.findme-photo.ru;
    add_header Cache-Control "private, no-store" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Vary "Cookie" always;
    access_log /var/log/nginx/access.log safe;
    ssl_certificate /etc/letsencrypt/live/photo-prjct/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/photo-prjct/privkey.pem;
    return 308 https://findme-photo.ru$request_uri;
}
server {
    listen 443 ssl;
    server_name findme-photo.ru;
    ssl_certificate /etc/letsencrypt/live/photo-prjct/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/photo-prjct/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    access_log /var/log/nginx/access.log safe;
    error_log /dev/null emerg;
    client_max_body_size 25m;
    proxy_hide_header Referrer-Policy;
    add_header Referrer-Policy "same-origin" always;
    add_header Strict-Transport-Security "max-age=86400" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    location ^~ /internal/ { return 404; }
    location = /metrics/ { return 404; }
    location ^~ /worker-diagnostics/ { return 404; }
    location = /telemetry/web-vitals/ {
        client_max_body_size 1k;
        limit_req zone=web_vitals_ip burst=10 nodelay;
        limit_req zone=web_vitals_global burst=100 nodelay;
        limit_req_status 429;
        access_log off;
        error_log /dev/null emerg;
        proxy_pass http://web:8000;
        proxy_http_version 1.1;
        proxy_set_header Host findme-photo.ru;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
    location ~ ^/(?:orders/[^/]+/(?:access/[^/]+/[^/]+|download)|events/[^/]+/selfie-search)(?:/|$) {
        proxy_hide_header Cache-Control;
        proxy_hide_header Referrer-Policy;
        proxy_hide_header Vary;
        add_header Cache-Control "private, no-store" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Vary "Cookie" always;
        add_header Strict-Transport-Security "max-age=86400" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        proxy_read_timeout 150s;
        proxy_pass http://web:8000;
        proxy_http_version 1.1;
        proxy_set_header Host findme-photo.ru;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
    location / {
        proxy_pass http://web:8000;
        proxy_http_version 1.1;
        proxy_set_header Host findme-photo.ru;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
server {
    listen 8081;
    server_name _;
    access_log off;
    location = /health/ {
        proxy_pass http://web:8000/health/;
        proxy_set_header Host localhost;
    }
    location / { return 404; }
}
