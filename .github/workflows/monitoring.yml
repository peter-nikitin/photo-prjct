name: Monitoring
on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize]
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: findme-monitoring-production
  cancel-in-progress: false
jobs:
  classify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      cloud_changed: ${{ steps.select.outputs.cloud_changed }}
      dashboard_changed: ${{ steps.select.outputs.dashboard_changed }}
      alerts_changed: ${{ steps.select.outputs.alerts_changed }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Classify managed monitoring inputs
        id: select
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          set -eu
          if [ "$EVENT_NAME" = workflow_dispatch ]; then
            printf '%s\n' 'cloud_changed=true' >> "$GITHUB_OUTPUT"
            printf '%s\n' 'dashboard_changed=true' >> "$GITHUB_OUTPUT"
            printf '%s\n' 'alerts_changed=true' >> "$GITHUB_OUTPUT"
          else
            python deploy/classify-release.py --observability --base "$BASE" --head "$HEAD" >> "$GITHUB_OUTPUT"
          fi
  validate:
    needs: classify
    if: needs.classify.outputs.cloud_changed == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          python -m venv /tmp/monitoring-tools
          /tmp/monitoring-tools/bin/pip install -r deploy/monitoring/prometheus/requirements.txt
          /tmp/monitoring-tools/bin/python -m unittest discover -s tests/monitoring -p test_remote_read_sdk.py
          /tmp/monitoring-tools/bin/python -m unittest discover -s tests/monitoring -p test_public_probe_function.py
          cat > /tmp/promtool <<'SCRIPT'
          #!/bin/sh
          exec docker run --rm --user "$(id -u):$(id -g)" --entrypoint promtool -v "$PWD:$PWD" -w "$PWD" prom/prometheus:v3.5.0 "$@"
          SCRIPT
          chmod +x /tmp/promtool
      - if: needs.classify.outputs.dashboard_changed == 'true'
        run: |
          /tmp/monitoring-tools/bin/python deploy/monitoring/prometheus/single_vm_dashboard.py --validate --promtool /tmp/promtool
      - if: needs.classify.outputs.alerts_changed == 'true'
        run: |
          /tmp/monitoring-tools/bin/python deploy/monitoring/prometheus/alerts.py --validate --promtool /tmp/promtool
  reconcile:
    needs: [classify, validate]
    if: >-
      github.ref == 'refs/heads/main' && github.event_name != 'pull_request' &&
      needs.classify.outputs.cloud_changed == 'true'
    runs-on: ubuntu-latest
    environment: monitoring
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          python -m venv /tmp/monitoring-tools
          /tmp/monitoring-tools/bin/pip install -r deploy/monitoring/prometheus/requirements.txt
      - if: needs.classify.outputs.dashboard_changed == 'true'
        run: |
          /tmp/monitoring-tools/bin/python deploy/monitoring/prometheus/single_vm_dashboard.py \
            --oidc-config deploy/monitoring/prometheus/oidc.json --backup "$PWD/monitoring-backup/dashboard"
      - if: needs.classify.outputs.alerts_changed == 'true'
        run: |
          /tmp/monitoring-tools/bin/python deploy/monitoring/prometheus/alerts.py \
            --oidc-config deploy/monitoring/prometheus/oidc.json --backup "$PWD/monitoring-backup/alerts"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: monitoring-backup-${{ github.run_id }}
          path: monitoring-backup
          if-no-files-found: ignore
