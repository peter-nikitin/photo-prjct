{% extends "ui/base.html" %}

{% block title %}Тестовая оплата — FindMe Photo{% endblock %}

{% block content %}
  <article aria-labelledby="simulator-title">
    <p><strong>Только для проверки — деньги не списываются.</strong></p>
    <h1 id="simulator-title">Тестовый банковский экран</h1>
    <p>Заказ {{ order.public_number }}, сумма {{ total_display }}.</p>
    <form method="post">
      {% csrf_token %}
      <p><button class="button" type="submit" name="outcome" value="succeeded">Подтвердить оплату</button></p>
      <p><button class="button" type="submit" name="outcome" value="pending">Оставить в ожидании</button></p>
      <p><button class="button" type="submit" name="outcome" value="canceled">Отменить оплату</button></p>
    </form>
  </article>
{% endblock %}
