name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  select-test-suites:
    name: Select test suites
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      operational: ${{ steps.select.outputs.operational }}
      migrations: ${{ steps.select.outputs.migrations }}
      visual: ${{ steps.select.outputs.visual }}
      operational_reason: ${{ steps.select.outputs.operational_reason }}
      migrations_reason: ${{ steps.select.outputs.migrations_reason }}
      visual_reason: ${{ steps.select.outputs.visual_reason }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Select changed-path suites
        id: select
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: >-
          python scripts/select_test_suites.py select --base "$BASE" --head "$HEAD"
          --format github >> "$GITHUB_OUTPUT"

  quality:
    name: Quality core
    needs: [select-test-suites]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: app
          POSTGRES_USER: app
          POSTGRES_PASSWORD: app
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U app -d app"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      SECRET_KEY: ci-not-a-secret
      DEBUG: "False"
      ALLOWED_HOSTS: localhost,127.0.0.1
      DB_NAME: app
      DB_USER: app
      DB_PASSWORD: app
      DB_HOST: localhost
      DB_PORT: "5432"
      TEST_DB_NAME: findme_test_${{ github.run_id }}_${{ github.run_attempt }}
      PHOTO_PROCESSING_ENABLED: "True"
      PHOTO_PROCESSING_FACE_ENABLED: "True"
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            src/backend/requirements.txt
            src/worker/requirements.txt
            requirements-dev.txt
      - name: Install dependencies
        run: pip install -r requirements-dev.txt -r src/worker/requirements.txt
      - name: Static analysis
        run: make static RUFF=ruff MYPY=mypy
      - name: Test core with coverage
        run: >-
          pytest -n 4 --dist loadscope -m "not operational and not migration and not clone_deployed_slow"
          --cov --cov-report=term-missing
      - name: Run Django system checks
        run: python src/backend/manage.py check
      - name: Check migration drift
        run: python src/backend/manage.py makemigrations --check --dry-run

  operational:
    name: Operational tests
    needs: [select-test-suites]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      SECRET_KEY: ci-not-a-secret
      DEBUG: "False"
      ALLOWED_HOSTS: localhost,127.0.0.1
      DB_NAME: app
      DB_USER: app
      DB_PASSWORD: app
      DB_HOST: localhost
      DB_PORT: "5432"
      TEST_DB_NAME: findme_test_${{ github.run_id }}_${{ github.run_attempt }}
      PHOTO_PROCESSING_ENABLED: "True"
      PHOTO_PROCESSING_FACE_ENABLED: "True"
    steps:
      - name: Selector reason
        env:
          SELECTOR_REASON: ${{ needs.select-test-suites.outputs.operational_reason }}
        run: printf '%s\n' "$SELECTOR_REASON"
      - name: Check out repository
        if: needs.select-test-suites.outputs.operational == 'true'
        uses: actions/checkout@v4
      - name: Set up Python
        if: needs.select-test-suites.outputs.operational == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            src/backend/requirements.txt
            src/worker/requirements.txt
            requirements-dev.txt
      - name: Install dependencies
        if: needs.select-test-suites.outputs.operational == 'true'
        run: pip install -r requirements-dev.txt -r src/worker/requirements.txt
      - name: Test operational layer
        if: needs.select-test-suites.outputs.operational == 'true'
        run: pytest -n 4 --dist loadscope -m "operational and not clone_deployed_slow"

  migration:
    name: Migration tests
    needs: [select-test-suites]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      SECRET_KEY: ci-not-a-secret
      DEBUG: "False"
      ALLOWED_HOSTS: localhost,127.0.0.1
      DB_NAME: app
      DB_USER: app
      DB_PASSWORD: app
      DB_HOST: localhost
      DB_PORT: "5432"
      TEST_DB_NAME: findme_test_${{ github.run_id }}_${{ github.run_attempt }}
      PHOTO_PROCESSING_ENABLED: "True"
      PHOTO_PROCESSING_FACE_ENABLED: "True"
    steps:
      - name: Selector reason
        env:
          SELECTOR_REASON: ${{ needs.select-test-suites.outputs.migrations_reason }}
        run: printf '%s\n' "$SELECTOR_REASON"
      - name: Check out repository
        if: needs.select-test-suites.outputs.migrations == 'true'
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Python
        if: needs.select-test-suites.outputs.migrations == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            src/backend/requirements.txt
            src/worker/requirements.txt
            requirements-dev.txt
      - name: Install dependencies
        if: needs.select-test-suites.outputs.migrations == 'true'
        run: pip install -r requirements-dev.txt -r src/worker/requirements.txt
      - name: Start PostgreSQL
        if: needs.select-test-suites.outputs.migrations == 'true'
        run: |
          docker run --detach --rm --name migration-postgres --publish 5432:5432 \
            --env POSTGRES_DB=app --env POSTGRES_USER=app --env POSTGRES_PASSWORD=app postgres:16
          for attempt in $(seq 1 15); do
            if docker exec migration-postgres pg_isready -U app -d app; then exit 0; fi
            sleep 1
          done
          docker ps --filter name=migration-postgres --format '{{.Status}}' || true
          docker logs --tail 100 migration-postgres || true
          exit 1
      - name: Test migration layer
        if: needs.select-test-suites.outputs.migrations == 'true'
        run: pytest -n 4 --dist loadscope -m migration
      - name: Check migration immutability
        if: needs.select-test-suites.outputs.migrations == 'true' && github.event_name == 'pull_request'
        run: >-
          python scripts/check_migration_immutability.py
          --base ${{ github.event.pull_request.base.sha }}
          --head ${{ github.event.pull_request.head.sha }}

  visual:
    name: Visual tests
    needs: [select-test-suites]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - name: Selector reason
        env:
          SELECTOR_REASON: ${{ needs.select-test-suites.outputs.visual_reason }}
        run: printf '%s\n' "$SELECTOR_REASON"
      - name: Check out repository
        if: needs.select-test-suites.outputs.visual == 'true'
        uses: actions/checkout@v4
      - name: Set up Node.js
        if: needs.select-test-suites.outputs.visual == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install visual test dependencies
        if: needs.select-test-suites.outputs.visual == 'true'
        run: npm ci
      - name: Run JavaScript unit tests
        if: needs.select-test-suites.outputs.visual == 'true'
        run: npm run test:js
      - name: Log in to GHCR for visual tests
        if: needs.select-test-suites.outputs.visual == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Run containerized visual regression tests
        if: needs.select-test-suites.outputs.visual == 'true'
        run: npm run test:visual
        env:
          VISUAL_TEST_IMAGE_PREFIX: ghcr.io/${{ github.repository }}-visual-tests
      - name: Upload visual test artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: visual-test-artifacts
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
