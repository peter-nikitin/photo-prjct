name: Deploy

on:
  workflow_dispatch:
    inputs:
      verify_private_storage:
        description: Run the confirmed real-storage contract probe after disabled deployment
        required: true
        default: false
        type: boolean
      verify_selfie_search_storage:
        description: Run the confirmed selfie-search temporary-storage preflight after disabled deployment
        required: true
        default: false
        type: boolean
      configure_monitoring_agent:
        description: Configure the Yandex Unified Agent without deploying the application
        required: true
        default: false
        type: boolean
      verify_selfie_feedback_storage:
        description: Run the confirmed dedicated feedback-storage preflight while feedback remains disabled
        required: true
        default: false
        type: boolean
      validate_deploy_issue:
        description: Exercise the bounded deployment issue notification drill
        required: true
        default: false
        type: boolean
      deployment_sha:
        description: Exact 40-character commit SHA to deploy manually
        required: false
        default: ""
        type: string
      verify_paused_observability_release:
        description: Verify the staged privileged package for deployment_sha before deployment
        required: true
        default: false
        type: boolean
      stage_paused_observability_release:
        description: Stage the checksum-bound privileged observability package for deployment_sha
        required: true
        default: false
        type: boolean
      preflight:
        description: Validate all Lockbox projections without mutating the deployment
        required: true
        default: false
        type: boolean
      cutover_compose_identity:
        description: Run the one-time canonical Compose identity cutover
        required: true
        default: false
        type: boolean

jobs:
  classify-release:
    name: Classify deployment release
    if: ${{ !inputs.preflight }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      requires_observability_bootstrap: ${{ steps.classify.outputs.requires_observability_bootstrap }}
      observability_source_manifest_sha256: ${{ steps.classify.outputs.observability_source_manifest_sha256 }}
      release_sha: ${{ steps.classify.outputs.release_sha }}
      worker_inputs_changed: ${{ steps.classify.outputs.worker_inputs_changed }}
    steps:
      - name: Check out release history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Classify deployment release
        id: classify
        env:
          DEPLOYMENT_SHA: ${{ inputs.deployment_sha }}
        run: |
          set -eu
          release_sha="${{ github.sha }}"
          requires_observability_bootstrap=${{ inputs.stage_paused_observability_release }}
          worker_inputs_changed=true
          manifest_sha256=
          pause_reason=
          if [ "${{ github.event_name }}" = workflow_dispatch ] && \
             [ "${{ inputs.configure_monitoring_agent }}" != true ] && \
             [ "${{ inputs.validate_deploy_issue }}" != true ]; then
            release_sha="$DEPLOYMENT_SHA"
            if [ "${#release_sha}" -ne 40 ] || [ -n "$(printf '%s' "$release_sha" | tr -d '0-9a-fA-F')" ]; then
              echo "deployment_sha must be an exact 40-character commit SHA" >&2
              exit 2
            fi
            release_sha="$(printf '%s' "$release_sha" | tr 'A-F' 'a-f')"
            git cat-file -e "$release_sha^{commit}" || {
              echo "deployment_sha must identify an available commit" >&2
              exit 2
            }
            test "$(git rev-parse "$release_sha^{commit}")" = "$release_sha" || {
              echo "deployment_sha must identify the commit object exactly" >&2
              exit 2
            }
          elif [ "${{ github.event_name }}" = push ]; then
            if [ "${{ github.event.before }}" = 0000000000000000000000000000000000000000 ]; then
              requires_observability_bootstrap=true
              pause_reason="Privileged package change status is unknown because the push base is unavailable."
            elif ! git diff --quiet "${{ github.event.before }}..${{ github.sha }}" -- deploy/bootstrap-selfie-observability.sh 'deploy/selfie-observability/**'; then
              requires_observability_bootstrap=true
              pause_reason="Commit ${GITHUB_SHA} changes the privileged selfie-observability package."
            fi
            if git diff --quiet "${{ github.event.before }}..${{ github.sha }}" -- Dockerfile.worker .dockerignore src/worker; then
              worker_inputs_changed=false
            fi
          fi

          if [ "$requires_observability_bootstrap" = true ] || \
             [ "${{ inputs.verify_paused_observability_release }}" = true ]; then
            git ls-tree -r --name-only "$release_sha" -- \
              deploy/bootstrap-selfie-observability.sh deploy/selfie-observability \
              | while IFS= read -r source_path; do
                  source_digest="$(git show "$release_sha:$source_path" | sha256sum | cut -d ' ' -f 1)"
                  printf '%s  %s\n' "$source_digest" "$source_path"
                done \
              > observability-source.sha256
            manifest_sha256="$(sha256sum observability-source.sha256 | cut -d ' ' -f 1)"
          fi
          echo "release_sha=$release_sha" >> "$GITHUB_OUTPUT"
          echo "requires_observability_bootstrap=$requires_observability_bootstrap" >> "$GITHUB_OUTPUT"
          echo "observability_source_manifest_sha256=$manifest_sha256" >> "$GITHUB_OUTPUT"
          echo "worker_inputs_changed=$worker_inputs_changed" >> "$GITHUB_OUTPUT"
          if [ "$requires_observability_bootstrap" = true ]; then
            {
              echo "## Privileged observability package staged"
              echo "Commit: ${release_sha}. ${pause_reason}"
              echo
              echo "Before deploying this package, complete these reviewed checks:"
              echo "1. cd /opt/photo-prjct/privileged-observability-releases/${release_sha}"
              echo "2. test \"\$(cat observability-release-sha)\" = \"${release_sha}\""
              echo "4. printf '%s  observability-source.sha256\\n' '${manifest_sha256}' | sha256sum --check -"
              echo "5. sha256sum --check observability-source.sha256"
              echo "6. DEPLOY_ROOT=/opt/photo-prjct/privileged-observability-releases/${release_sha} sh /opt/photo-prjct/privileged-observability-releases/${release_sha}/deploy/bootstrap-selfie-observability.sh"
              echo "7. sudo /usr/local/sbin/findme-selfie-observability verify"
              echo "8. Manually run Deploy with deployment_sha=${release_sha} and verify_paused_observability_release=true."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

  stage-observability-release:
    name: Stage privileged observability source
    if: ${{ inputs.stage_paused_observability_release && !inputs.preflight }}
    runs-on: ubuntu-latest
    needs: [classify-release]
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out staged commit
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.classify-release.outputs.release_sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Bind source to staged commit
        run: |
          set -eu
          release_sha="${{ needs.classify-release.outputs.release_sha }}"
          test "$(git rev-parse HEAD)" = "$release_sha"
          printf '%s\n' "$release_sha" > observability-release-sha
      - name: Create staged source manifest
        run: |
          set -eu
          git ls-tree -r --name-only "${{ needs.classify-release.outputs.release_sha }}" -- \
            deploy/bootstrap-selfie-observability.sh deploy/selfie-observability \
            | while IFS= read -r source_path; do sha256sum "$source_path"; done \
            > observability-source.sha256
          manifest_sha256="$(sha256sum observability-source.sha256 | cut -d ' ' -f 1)"
          test "$manifest_sha256" = "${{ needs.classify-release.outputs.observability_source_manifest_sha256 }}"
      - name: Stage privileged observability source
        env:
          VM_HOST: ${{ vars.VM_HOST }}
          VM_USER: ${{ vars.VM_USER }}
          VM_SSH_KNOWN_HOSTS: ${{ vars.VM_SSH_KNOWN_HOSTS }}
          RELEASE_SHA: ${{ needs.classify-release.outputs.release_sha }}
          OBSERVABILITY_SOURCE_MANIFEST_SHA256: ${{ needs.classify-release.outputs.observability_source_manifest_sha256 }}
        run: |
          python scripts/run-with-environment-secrets.py \
            --consumer remote-check \
            --identity github-oidc \
            -- deploy/run-remote.sh stage-paused-observability-release

  build:
    name: Build immutable image
    if: ${{ !inputs.configure_monitoring_agent && !inputs.validate_deploy_issue && !inputs.preflight && !inputs.stage_paused_observability_release }}
    runs-on: ubuntu-latest
    needs: [classify-release]
    permissions:
      contents: read
      packages: write
    outputs:
      app_image: ${{ steps.image.outputs.app_image }}
      worker_image: ${{ steps.image.outputs.worker_image }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.classify-release.outputs.release_sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver: docker-container
      - name: Select image references
        id: image
        run: |
          release_sha="${{ needs.classify-release.outputs.release_sha }}"
          echo "app_image=ghcr.io/${GITHUB_REPOSITORY}:${release_sha}" >> "$GITHUB_OUTPUT"
          echo "worker_image=ghcr.io/${GITHUB_REPOSITORY}-worker:${release_sha}" >> "$GITHUB_OUTPUT"
      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.image.outputs.app_image }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web,ignore-error=true
      - name: Reuse unchanged worker image
        id: reuse-worker
        if: ${{ github.event_name == 'push' && needs.classify-release.outputs.worker_inputs_changed == 'false' }}
        continue-on-error: true
        env:
          PREVIOUS_WORKER_IMAGE: ghcr.io/${{ github.repository }}-worker:${{ github.event.before }}
          WORKER_IMAGE: ${{ steps.image.outputs.worker_image }}
        run: |
          digest="$(docker buildx imagetools inspect "$PREVIOUS_WORKER_IMAGE" --format '{{.Manifest.Digest}}')"
          test -n "$digest"
          docker buildx imagetools create --tag "$WORKER_IMAGE" "$PREVIOUS_WORKER_IMAGE@$digest"
      - name: Build and push worker image
        if: ${{ github.event_name == 'workflow_dispatch' || needs.classify-release.outputs.worker_inputs_changed == 'true' || steps.reuse-worker.outcome != 'success' }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.worker
          push: true
          tags: ${{ steps.image.outputs.worker_image }}
          cache-from: type=gha,scope=worker
          cache-to: type=gha,mode=max,scope=worker,ignore-error=true

  deploy:
    name: Deploy
    if: ${{ !inputs.configure_monitoring_agent && !inputs.validate_deploy_issue && !inputs.preflight && !inputs.stage_paused_observability_release }}
    runs-on: ubuntu-latest
    needs: [classify-release, build]
    permissions:
      contents: read
      id-token: write
    concurrency:
      group: deploy
      cancel-in-progress: false
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.classify-release.outputs.release_sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Verify staged paused observability release
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.verify_paused_observability_release }}
        env:
          VM_HOST: ${{ vars.VM_HOST }}
          VM_USER: ${{ vars.VM_USER }}
          VM_SSH_KNOWN_HOSTS: ${{ vars.VM_SSH_KNOWN_HOSTS }}
          RELEASE_SHA: ${{ needs.classify-release.outputs.release_sha }}
          OBSERVABILITY_SOURCE_MANIFEST_SHA256: ${{ needs.classify-release.outputs.observability_source_manifest_sha256 }}
        run: |
          python scripts/run-with-environment-secrets.py \
            --consumer remote-check \
            --identity github-oidc \
            -- deploy/run-remote.sh verify-paused-observability-release
      - name: Run deployment
        env:
          VM_HOST: ${{ vars.VM_HOST }}
          VM_USER: ${{ vars.VM_USER }}
          VM_SSH_KNOWN_HOSTS: ${{ vars.VM_SSH_KNOWN_HOSTS }}
          APP_IMAGE: ${{ needs.build.outputs.app_image }}
          WORKER_IMAGE: ${{ needs.build.outputs.worker_image }}
          DEBUG: "False"
          ALLOWED_HOSTS: ${{ vars.ALLOWED_HOSTS }}
          GUNICORN_WORKERS: '5'
          GUNICORN_THREADS: '2'
          GUNICORN_TIMEOUT: '180'
          GUNICORN_MAX_REQUESTS: '1000'
          GUNICORN_MAX_REQUESTS_JITTER: '100'
          DB_NAME: ${{ vars.DB_NAME }}
          DB_USER: ${{ vars.DB_USER }}
          PUBLIC_DOMAIN: ${{ vars.PUBLIC_DOMAIN }}
          PUBLIC_DOMAIN_ALIAS: ${{ vars.PUBLIC_DOMAIN_ALIAS }}
          MEDIA_STORAGE_BACKEND: ${{ vars.MEDIA_STORAGE_BACKEND || 'filesystem' }}
          MEDIA_S3_ENDPOINT_URL: ${{ vars.MEDIA_S3_ENDPOINT_URL || 'https://storage.yandexcloud.net' }}
          MEDIA_S3_REGION: ${{ vars.MEDIA_S3_REGION || 'ru-central1' }}
          MEDIA_S3_PUBLIC_BUCKET: ${{ vars.MEDIA_S3_PUBLIC_BUCKET }}
          PHOTO_UPLOAD_ENABLED: ${{ vars.PHOTO_UPLOAD_ENABLED || 'False' }}
          PRIVATE_MEDIA_S3_BUCKET: ${{ vars.PRIVATE_MEDIA_S3_BUCKET }}
          PRIVATE_MEDIA_ALLOWED_ORIGINS: ${{ vars.PRIVATE_MEDIA_ALLOWED_ORIGINS }}
          PHOTO_PROCESSING_ENABLED: ${{ vars.PHOTO_PROCESSING_ENABLED || 'True' }}
          PHOTO_PROCESSING_PREVIEW_ENABLED: ${{ vars.PHOTO_PROCESSING_PREVIEW_ENABLED || 'True' }}
          PHOTO_PROCESSING_FACE_ENABLED: ${{ vars.PHOTO_PROCESSING_FACE_ENABLED || 'True' }}
          PHOTO_PROCESSING_DOWNLOAD_TTL_SECONDS: ${{ vars.PHOTO_PROCESSING_DOWNLOAD_TTL_SECONDS || '120' }}
          PHOTO_PROCESSING_MAX_REQUEST_BYTES: ${{ vars.PHOTO_PROCESSING_MAX_REQUEST_BYTES || '393216' }}
          PHOTO_WORKER_BUILD: ${{ vars.PHOTO_WORKER_BUILD || 'capture-metadata-v1' }}
          PHOTO_WORKER_LEASE_SECONDS: ${{ vars.PHOTO_WORKER_LEASE_SECONDS || '120' }}
          # Preserve an explicitly configured identity list; otherwise run capture metadata v2.
          # The ordered processor-type contract below still lets the worker poll typed defaults,
          # including selfie_query.
          PHOTO_WORKER_PROCESSOR_IDENTITIES: ${{ vars.PHOTO_WORKER_PROCESSOR_IDENTITIES || '1/capture_metadata/2,2/generate_preview/1,2/face_embedding/3,3/face_embedding/5,1/selfie_query/2' }}
          PHOTO_WORKER_PROCESSOR_TYPES: ${{ vars.PHOTO_WORKER_PROCESSOR_TYPES || 'selfie_query,face_embedding,capture_metadata,generate_preview' }}
          PHOTO_WORKER_REPLICAS: ${{ vars.PHOTO_WORKER_REPLICAS || '1' }}
          SELFIE_SEARCH_MAX_UPLOAD_BYTES: ${{ vars.SELFIE_SEARCH_MAX_UPLOAD_BYTES || '20971520' }}
          SELFIE_SEARCH_MAX_PIXELS: ${{ vars.SELFIE_SEARCH_MAX_PIXELS || '25000000' }}
          SELFIE_SEARCH_DOWNLOAD_TTL_SECONDS: ${{ vars.SELFIE_SEARCH_DOWNLOAD_TTL_SECONDS || '120' }}
          SELFIE_SEARCH_EMBEDDING_MODEL: ${{ vars.SELFIE_SEARCH_EMBEDDING_MODEL || 'sface' }}
          SELFIE_SEARCH_EMBEDDING_DIMENSIONS: ${{ vars.SELFIE_SEARCH_EMBEDDING_DIMENSIONS || '128' }}
          SELFIE_SEARCH_COSINE_DISTANCE_THRESHOLD: ${{ vars.SELFIE_SEARCH_COSINE_DISTANCE_THRESHOLD || '0.363' }}
          SELFIE_SEARCH_TEMPORARY_PREFIX: ${{ vars.SELFIE_SEARCH_TEMPORARY_PREFIX || 'selfie-search/' }}
          SELFIE_SEARCH_LIFECYCLE_MAX_AGE_HOURS: ${{ vars.SELFIE_SEARCH_LIFECYCLE_MAX_AGE_HOURS || '24' }}
          SELFIE_FEEDBACK_ENABLED: ${{ vars.SELFIE_FEEDBACK_ENABLED || 'False' }}
          SELFIE_FEEDBACK_S3_BUCKET: ${{ vars.SELFIE_FEEDBACK_S3_BUCKET }}
          SELFIE_FEEDBACK_S3_ENDPOINT_URL: ${{ vars.SELFIE_FEEDBACK_S3_ENDPOINT_URL || 'https://storage.yandexcloud.net' }}
          SELFIE_FEEDBACK_S3_REGION: ${{ vars.SELFIE_FEEDBACK_S3_REGION || 'ru-central1' }}
          SELFIE_FEEDBACK_KMS_KEY_ID: ${{ vars.SELFIE_FEEDBACK_KMS_KEY_ID }}
          SELFIE_FEEDBACK_STORAGE_PREFLIGHT_CONFIRMED: ${{ vars.SELFIE_FEEDBACK_STORAGE_PREFLIGHT_CONFIRMED || 'False' }}
          GHCR_USERNAME: ${{ vars.GHCR_USERNAME }}
        run: |
          if [ "${{ inputs.cutover_compose_identity }}" = true ]; then
            COMPOSE_IDENTITY_CUTOVER_CONFIRMATION=confirm-canonical-compose-identity-cutover \
              python scripts/run-with-environment-secrets.py \
                --consumer deploy \
                --identity github-oidc \
                -- deploy/run-remote.sh cutover-compose-identity
          else
            python scripts/run-with-environment-secrets.py \
              --consumer deploy \
              --identity github-oidc \
              -- deploy/run-remote.sh deploy
          fi
      - name: Verify private upload storage contract
        if: ${{ inputs.verify_private_storage }}
        env:
          VM_HOST: ${{ vars.VM_HOST }}
          VM_USER: ${{ vars.VM_USER }}
          VM_SSH_KNOWN_HOSTS: ${{ vars.VM_SSH_KNOWN_HOSTS }}
          PRIVATE_MEDIA_ALLOWED_ORIGINS: ${{ vars.PRIVATE_MEDIA_ALLOWED_ORIGINS }}
        run: |
          python scripts/run-with-environment-secrets.py \
            --consumer remote-check \
            --identity github-oidc \
            -- deploy/run-remote.sh private-storage
      - name: Verify selfie-search temporary storage contract
        if: ${{ inputs.verify_selfie_search_storage }}
        env:
          VM_HOST: ${{ vars.VM_HOST }}
          VM_USER: ${{ vars.VM_USER }}
          VM_SSH_KNOWN_HOSTS: ${{ vars.VM_SSH_KNOWN_HOSTS }}
        run: |
          python scripts/run-with-environment-secrets.py \
            --consumer remote-check \
            --identity github-oidc \
            -- deploy/run-remote.sh selfie-storage
      - name: Verify selfie-feedback storage contract
        if: ${{ inputs.verify_selfie_feedback_storage }}
        env:
          VM_HOST: ${{ vars.VM_HOST }}
          VM_USER: ${{ vars.VM_USER }}
          VM_SSH_KNOWN_HOSTS: ${{ vars.VM_SSH_KNOWN_HOSTS }}
          SELFIE_FEEDBACK_ENABLED: ${{ vars.SELFIE_FEEDBACK_ENABLED || 'False' }}
          SELFIE_FEEDBACK_S3_BUCKET: ${{ vars.SELFIE_FEEDBACK_S3_BUCKET }}
          SELFIE_FEEDBACK_KMS_KEY_ID: ${{ vars.SELFIE_FEEDBACK_KMS_KEY_ID }}
        run: |
          python scripts/run-with-environment-secrets.py \
            --consumer deploy \
            --identity github-oidc \
            -- deploy/run-remote.sh selfie-feedback-storage

  reconcile-deploy-issue:
    name: Reconcile deployment issue
    if: ${{ always() && !inputs.configure_monitoring_agent && !inputs.validate_deploy_issue && !inputs.preflight && !inputs.stage_paused_observability_release }}
    runs-on: ubuntu-latest
    needs: [classify-release, build, deploy]
    permissions:
      actions: read
      contents: read
      issues: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Reconcile issue state
        id: reconcile
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ needs.build.result }}" = failure ]; then
            conclusion=failure
            phase=build
          elif [ "${{ needs.deploy.result }}" = success ]; then
            conclusion=success
            phase=commit
          elif [ "${{ needs.deploy.result }}" != failure ]; then
            exit 0
          else
            conclusion=failure
            phase="$(
              gh run view "$GITHUB_RUN_ID" --log-failed 2>/dev/null | awk '
                /(^|[[:space:]])DEPLOY_PHASE=(validate|snapshot|candidate-pull|private-media-preflight|migration-preflight|projection-preflight|observability-preflight|observability-reconcile|certificate|compose-reconcile|local-health|worker-health|public-health|observability-verify|commit) elapsed_seconds=[0-9]+$/ {
                  phase = $0
                  sub(/^.*DEPLOY_PHASE=/, "", phase)
                  sub(/ elapsed_seconds=[0-9]+$/, "", phase)
                }
                END {
                  if (phase != "") {
                    print phase
                  } else {
                    print "unknown"
                  }
                }
              '
            )"
          fi

          python scripts/reconcile_deploy_issue.py \
            --repository "$GITHUB_REPOSITORY" \
            --token-env GITHUB_TOKEN \
            --mode deploy \
            --conclusion "$conclusion" \
            --sha "${{ needs.classify-release.outputs.release_sha }}" \
            --run-url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            --phase "$phase"
      - name: Warn when issue reconciliation fails
        if: ${{ steps.reconcile.outcome == 'failure' }}
        run: echo "::warning::Deployment issue reconciliation failed; the deployment result remains authoritative."

  validate-deploy-issue:
    name: Validate deployment issue notification
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.validate_deploy_issue && !inputs.preflight }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    env:
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Create validation issue
        run: |
          python scripts/reconcile_deploy_issue.py \
            --repository "$GITHUB_REPOSITORY" --token-env GITHUB_TOKEN --mode validation \
            --conclusion failure --sha "$GITHUB_SHA" \
            --run-url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            --phase validate
      - name: Update validation issue
        run: |
          python scripts/reconcile_deploy_issue.py \
            --repository "$GITHUB_REPOSITORY" --token-env GITHUB_TOKEN --mode validation \
            --conclusion failure --sha "$GITHUB_SHA" \
            --run-url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            --phase snapshot
      - name: Close validation issue
        run: |
          python scripts/reconcile_deploy_issue.py \
            --repository "$GITHUB_REPOSITORY" --token-env GITHUB_TOKEN --mode validation \
            --conclusion success --sha "$GITHUB_SHA" \
            --run-url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            --phase commit
      - name: Assert validation issue is closed
        run: |
          if gh api \
            "/repos/$GITHUB_REPOSITORY/issues?state=open&per_page=100" \
            --jq '.[] | select((.pull_request | not) and .title == "[deployment validation] notification drill") | .number' \
            | grep -q .; then
            echo "Validation issue remains open" >&2
            exit 1
          fi

  configure-monitoring-agent:
    name: Configure Unified Agent
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.configure_monitoring_agent && !inputs.validate_deploy_issue && !inputs.preflight }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Configure Unified Agent
        env:
          VM_HOST: ${{ vars.VM_HOST }}
          VM_USER: ${{ vars.VM_USER }}
          VM_SSH_KNOWN_HOSTS: ${{ vars.VM_SSH_KNOWN_HOSTS }}
          YANDEX_CLOUD_FOLDER_ID: ${{ vars.YANDEX_CLOUD_FOLDER_ID }}
        run: |
          python scripts/run-with-environment-secrets.py \
            --consumer remote-check \
            --identity github-oidc \
            -- deploy/run-remote.sh configure-monitoring

  lockbox-preflight:
    name: Validate Lockbox projections
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.preflight }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: "Verify Lockbox projection: local-web"
        run: |
          python scripts/run-with-environment-secrets.py \
            --consumer local-web --identity github-oidc \
            -- python scripts/verify-environment-secret-projection.py local-web
      - name: "Verify Lockbox projection: deploy"
        run: |
          python scripts/run-with-environment-secrets.py \
            --consumer deploy --identity github-oidc \
            -- python scripts/verify-environment-secret-projection.py deploy
      - name: "Verify Lockbox projection: remote-check"
        run: |
          python scripts/run-with-environment-secrets.py \
            --consumer remote-check --identity github-oidc \
            -- python scripts/verify-environment-secret-projection.py remote-check
      - name: "Verify Lockbox projection: public-monitor"
        run: |
          python scripts/run-with-environment-secrets.py \
            --consumer public-monitor --identity github-oidc \
            -- python scripts/verify-environment-secret-projection.py public-monitor
      - name: Verify read-only remote preflight
        env:
          VM_HOST: ${{ vars.VM_HOST }}
          VM_USER: ${{ vars.VM_USER }}
          VM_SSH_KNOWN_HOSTS: ${{ vars.VM_SSH_KNOWN_HOSTS }}
        run: |
          python scripts/run-with-environment-secrets.py \
            --consumer remote-check --identity github-oidc \
            -- deploy/run-remote.sh remote-preflight
