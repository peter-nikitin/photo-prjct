name: Deploy staging

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      verify_private_storage:
        description: Run the confirmed real-storage contract probe after disabled deployment
        required: true
        default: false
        type: boolean
      verify_selfie_search_storage:
        description: Run the confirmed selfie-search temporary-storage preflight after disabled deployment
        required: true
        default: false
        type: boolean
      configure_monitoring_agent:
        description: Configure the staging Yandex Unified Agent without deploying the application
        required: true
        default: false
        type: boolean
      verify_selfie_feedback_storage:
        description: Run the confirmed dedicated feedback-storage preflight while feedback remains disabled
        required: true
        default: false
        type: boolean

jobs:
  build:
    name: Build immutable image
    if: ${{ github.event_name == 'push' || !inputs.configure_monitoring_agent }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      app_image: ${{ steps.image.outputs.app_image }}
      worker_image: ${{ steps.image.outputs.worker_image }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Select image references
        id: image
        run: |
          echo "app_image=ghcr.io/${GITHUB_REPOSITORY}:${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
          echo "worker_image=ghcr.io/${GITHUB_REPOSITORY}-worker:${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.image.outputs.app_image }}
      - name: Build and push worker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.worker
          push: true
          tags: ${{ steps.image.outputs.worker_image }}

  deploy:
    name: Deploy staging
    if: ${{ github.event_name == 'push' || !inputs.configure_monitoring_agent }}
    runs-on: ubuntu-latest
    needs: build
    environment: staging
    concurrency:
      group: deploy-staging
      cancel-in-progress: false
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Copy staging deployment files
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_KEY }}
          source: docker-compose.prod.yml,docker-compose.https.yml,deploy
          target: /opt/photo-prjct/
      - name: Apply staging deployment
        uses: appleboy/ssh-action@v1.0.3
        env:
          DEPLOYMENT_TARGET: staging
          APP_IMAGE: ${{ needs.build.outputs.app_image }}
          SECRET_KEY: ${{ secrets.SECRET_KEY }}
          DEBUG: "False"
          ALLOWED_HOSTS: ${{ secrets.ALLOWED_HOSTS }}
          GUNICORN_WORKERS: '5'
          GUNICORN_THREADS: '2'
          GUNICORN_TIMEOUT: '180'
          GUNICORN_MAX_REQUESTS: '1000'
          GUNICORN_MAX_REQUESTS_JITTER: '100'
          DB_NAME: ${{ secrets.DB_NAME }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          PUBLIC_DOMAIN: ${{ vars.PUBLIC_DOMAIN }}
          PUBLIC_DOMAIN_ALIAS: ${{ vars.PUBLIC_DOMAIN_ALIAS }}
          LETSENCRYPT_EMAIL: ${{ secrets.LETSENCRYPT_EMAIL }}
          MEDIA_STORAGE_BACKEND: ${{ vars.MEDIA_STORAGE_BACKEND || 'filesystem' }}
          MEDIA_S3_ENDPOINT_URL: ${{ vars.MEDIA_S3_ENDPOINT_URL || 'https://storage.yandexcloud.net' }}
          MEDIA_S3_REGION: ${{ vars.MEDIA_S3_REGION || 'ru-central1' }}
          MEDIA_S3_PUBLIC_BUCKET: ${{ vars.MEDIA_S3_PUBLIC_BUCKET }}
          MEDIA_S3_ACCESS_KEY_ID: ${{ secrets.MEDIA_S3_ACCESS_KEY_ID }}
          MEDIA_S3_SECRET_ACCESS_KEY: ${{ secrets.MEDIA_S3_SECRET_ACCESS_KEY }}
          PHOTO_UPLOAD_ENABLED: ${{ vars.PHOTO_UPLOAD_ENABLED || 'False' }}
          PRIVATE_MEDIA_S3_BUCKET: ${{ vars.PRIVATE_MEDIA_S3_BUCKET }}
          PRIVATE_MEDIA_S3_ACCESS_KEY_ID: ${{ secrets.PRIVATE_MEDIA_S3_ACCESS_KEY_ID }}
          PRIVATE_MEDIA_S3_SECRET_ACCESS_KEY: ${{ secrets.PRIVATE_MEDIA_S3_SECRET_ACCESS_KEY }}
          PRIVATE_MEDIA_ALLOWED_ORIGINS: ${{ vars.PRIVATE_MEDIA_ALLOWED_ORIGINS }}
          WORKER_IMAGE: ${{ needs.build.outputs.worker_image }}
          PHOTO_PROCESSING_ENABLED: ${{ vars.PHOTO_PROCESSING_ENABLED || 'False' }}
          PHOTO_PROCESSING_PREVIEW_ENABLED: ${{ vars.PHOTO_PROCESSING_PREVIEW_ENABLED || 'False' }}
          PHOTO_PROCESSING_FACE_ENABLED: ${{ vars.PHOTO_PROCESSING_FACE_ENABLED || 'False' }}
          PHOTO_PROCESSING_WORKER_TOKEN: ${{ secrets.PHOTO_PROCESSING_WORKER_TOKEN }}
          PHOTO_PROCESSING_DOWNLOAD_TTL_SECONDS: ${{ vars.PHOTO_PROCESSING_DOWNLOAD_TTL_SECONDS || '120' }}
          PHOTO_PROCESSING_MAX_REQUEST_BYTES: ${{ vars.PHOTO_PROCESSING_MAX_REQUEST_BYTES || '131072' }}
          PHOTO_WORKER_BUILD: ${{ vars.PHOTO_WORKER_BUILD || 'capture-metadata-v1' }}
          PHOTO_WORKER_LEASE_SECONDS: ${{ vars.PHOTO_WORKER_LEASE_SECONDS || '120' }}
          # Preserve an explicitly configured identity list; otherwise run capture metadata v2.
          # The ordered processor-type contract below still lets the worker poll typed defaults,
          # including selfie_query.
          PHOTO_WORKER_PROCESSOR_IDENTITIES: ${{ vars.PHOTO_WORKER_PROCESSOR_IDENTITIES || '1/capture_metadata/2' }}
          PHOTO_WORKER_PROCESSOR_TYPES: ${{ vars.PHOTO_WORKER_PROCESSOR_TYPES || 'selfie_query,face_embedding,capture_metadata,generate_preview' }}
          PHOTO_WORKER_REPLICAS: ${{ vars.PHOTO_WORKER_REPLICAS || '1' }}
          SELFIE_SEARCH_ENABLED: ${{ vars.SELFIE_SEARCH_ENABLED || 'False' }}
          SELFIE_SEARCH_MAX_UPLOAD_BYTES: ${{ vars.SELFIE_SEARCH_MAX_UPLOAD_BYTES || '20971520' }}
          SELFIE_SEARCH_MAX_PIXELS: ${{ vars.SELFIE_SEARCH_MAX_PIXELS || '25000000' }}
          SELFIE_SEARCH_DOWNLOAD_TTL_SECONDS: ${{ vars.SELFIE_SEARCH_DOWNLOAD_TTL_SECONDS || '120' }}
          SELFIE_SEARCH_EMBEDDING_MODEL: ${{ vars.SELFIE_SEARCH_EMBEDDING_MODEL || 'sface' }}
          SELFIE_SEARCH_EMBEDDING_DIMENSIONS: ${{ vars.SELFIE_SEARCH_EMBEDDING_DIMENSIONS || '128' }}
          SELFIE_SEARCH_COSINE_DISTANCE_THRESHOLD: ${{ vars.SELFIE_SEARCH_COSINE_DISTANCE_THRESHOLD || '0.363' }}
          SELFIE_SEARCH_TEMPORARY_PREFIX: ${{ vars.SELFIE_SEARCH_TEMPORARY_PREFIX || 'selfie-search/' }}
          SELFIE_SEARCH_LIFECYCLE_MAX_AGE_HOURS: ${{ vars.SELFIE_SEARCH_LIFECYCLE_MAX_AGE_HOURS || '24' }}
          SELFIE_FEEDBACK_ENABLED: ${{ vars.SELFIE_FEEDBACK_ENABLED || 'False' }}
          SELFIE_FEEDBACK_S3_BUCKET: ${{ vars.SELFIE_FEEDBACK_S3_BUCKET }}
          SELFIE_FEEDBACK_S3_ACCESS_KEY_ID: ${{ secrets.SELFIE_FEEDBACK_S3_ACCESS_KEY_ID }}
          SELFIE_FEEDBACK_S3_SECRET_ACCESS_KEY: ${{ secrets.SELFIE_FEEDBACK_S3_SECRET_ACCESS_KEY }}
          SELFIE_FEEDBACK_S3_ENDPOINT_URL: ${{ vars.SELFIE_FEEDBACK_S3_ENDPOINT_URL || 'https://storage.yandexcloud.net' }}
          SELFIE_FEEDBACK_S3_REGION: ${{ vars.SELFIE_FEEDBACK_S3_REGION || 'ru-central1' }}
          SELFIE_FEEDBACK_KMS_KEY_ID: ${{ vars.SELFIE_FEEDBACK_KMS_KEY_ID }}
          SELFIE_FEEDBACK_STORAGE_PREFLIGHT_CONFIRMED: ${{ vars.SELFIE_FEEDBACK_STORAGE_PREFLIGHT_CONFIRMED || 'False' }}
          GHCR_USERNAME: ${{ secrets.GHCR_USERNAME }}
          GHCR_READ_TOKEN: ${{ secrets.GHCR_READ_TOKEN }}
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_KEY }}
          script_stop: true
          envs: APP_IMAGE,SECRET_KEY,DEBUG,ALLOWED_HOSTS,GUNICORN_WORKERS,GUNICORN_THREADS,GUNICORN_TIMEOUT,GUNICORN_MAX_REQUESTS,GUNICORN_MAX_REQUESTS_JITTER,DB_NAME,DB_USER,DB_PASSWORD,PUBLIC_DOMAIN,PUBLIC_DOMAIN_ALIAS,LETSENCRYPT_EMAIL,MEDIA_STORAGE_BACKEND,MEDIA_S3_ENDPOINT_URL,MEDIA_S3_REGION,MEDIA_S3_PUBLIC_BUCKET,MEDIA_S3_ACCESS_KEY_ID,MEDIA_S3_SECRET_ACCESS_KEY,PHOTO_UPLOAD_ENABLED,PRIVATE_MEDIA_S3_BUCKET,PRIVATE_MEDIA_S3_ACCESS_KEY_ID,PRIVATE_MEDIA_S3_SECRET_ACCESS_KEY,PRIVATE_MEDIA_ALLOWED_ORIGINS,WORKER_IMAGE,PHOTO_PROCESSING_ENABLED,PHOTO_PROCESSING_PREVIEW_ENABLED,PHOTO_PROCESSING_FACE_ENABLED,PHOTO_PROCESSING_WORKER_TOKEN,PHOTO_PROCESSING_DOWNLOAD_TTL_SECONDS,PHOTO_PROCESSING_MAX_REQUEST_BYTES,PHOTO_WORKER_BUILD,PHOTO_WORKER_LEASE_SECONDS,PHOTO_WORKER_PROCESSOR_IDENTITIES,PHOTO_WORKER_PROCESSOR_TYPES,PHOTO_WORKER_REPLICAS,SELFIE_SEARCH_ENABLED,SELFIE_SEARCH_MAX_UPLOAD_BYTES,SELFIE_SEARCH_MAX_PIXELS,SELFIE_SEARCH_DOWNLOAD_TTL_SECONDS,SELFIE_SEARCH_EMBEDDING_MODEL,SELFIE_SEARCH_EMBEDDING_DIMENSIONS,SELFIE_SEARCH_COSINE_DISTANCE_THRESHOLD,SELFIE_SEARCH_TEMPORARY_PREFIX,SELFIE_SEARCH_LIFECYCLE_MAX_AGE_HOURS,SELFIE_FEEDBACK_ENABLED,SELFIE_FEEDBACK_S3_BUCKET,SELFIE_FEEDBACK_S3_ACCESS_KEY_ID,SELFIE_FEEDBACK_S3_SECRET_ACCESS_KEY,SELFIE_FEEDBACK_S3_ENDPOINT_URL,SELFIE_FEEDBACK_S3_REGION,SELFIE_FEEDBACK_KMS_KEY_ID,SELFIE_FEEDBACK_STORAGE_PREFLIGHT_CONFIRMED,GHCR_USERNAME,GHCR_READ_TOKEN,DEPLOYMENT_TARGET
          script: DEPLOY_ROOT=/opt/photo-prjct COMPOSE_PROJECT_NAME=photo-prjct-staging sh /opt/photo-prjct/deploy/apply-deployment.sh
      - name: Verify private upload storage contract
        if: ${{ inputs.verify_private_storage }}
        uses: appleboy/ssh-action@v1.0.3
        env:
          PRIVATE_MEDIA_ALLOWED_ORIGINS: ${{ vars.PRIVATE_MEDIA_ALLOWED_ORIGINS }}
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_KEY }}
          envs: PRIVATE_MEDIA_ALLOWED_ORIGINS
          script_stop: true
          script: |
            cd /opt/photo-prjct
            docker compose --project-name photo-prjct-staging \
              --env-file .env \
              -f docker-compose.prod.yml \
              -f docker-compose.https.yml \
              exec -T -e PHOTO_UPLOAD_ENABLED=True web \
              sh -lc 'python manage.py verify_private_upload_storage --confirm-real-storage --origin "$PRIVATE_MEDIA_ALLOWED_ORIGINS"'
      - name: Verify selfie-search temporary storage contract
        if: ${{ inputs.verify_selfie_search_storage }}
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_KEY }}
          script_stop: true
          script: |
            cd /opt/photo-prjct
            test "$(sed -n 's/^SELFIE_SEARCH_ENABLED=//p' .env | head -n 1)" = False
            docker compose --project-name photo-prjct-staging \
              --env-file .env \
              -f docker-compose.prod.yml \
              -f docker-compose.https.yml \
              exec -T web \
              python manage.py verify_selfie_search_storage --confirm-real-storage
      - name: Verify selfie-feedback storage contract
        if: ${{ inputs.verify_selfie_feedback_storage }}
        uses: appleboy/ssh-action@v1.0.3
        env:
          SELFIE_FEEDBACK_S3_BUCKET: ${{ vars.SELFIE_FEEDBACK_S3_BUCKET }}
          SELFIE_FEEDBACK_S3_ACCESS_KEY_ID: ${{ secrets.SELFIE_FEEDBACK_S3_ACCESS_KEY_ID }}
          SELFIE_FEEDBACK_S3_SECRET_ACCESS_KEY: ${{ secrets.SELFIE_FEEDBACK_S3_SECRET_ACCESS_KEY }}
          SELFIE_FEEDBACK_KMS_KEY_ID: ${{ vars.SELFIE_FEEDBACK_KMS_KEY_ID }}
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_KEY }}
          envs: SELFIE_FEEDBACK_S3_BUCKET,SELFIE_FEEDBACK_S3_ACCESS_KEY_ID,SELFIE_FEEDBACK_S3_SECRET_ACCESS_KEY,SELFIE_FEEDBACK_KMS_KEY_ID
          script_stop: true
          script: |
            cd /opt/photo-prjct
            test "$(sed -n 's/^SELFIE_FEEDBACK_ENABLED=//p' .env | head -n 1)" = False
            docker compose --project-name photo-prjct-staging \
              --env-file .env \
              -f docker-compose.prod.yml \
              -f docker-compose.https.yml \
              exec -T \
              -e SELFIE_FEEDBACK_ENABLED=True \
              -e SELFIE_FEEDBACK_S3_BUCKET \
              -e SELFIE_FEEDBACK_S3_ACCESS_KEY_ID \
              -e SELFIE_FEEDBACK_S3_SECRET_ACCESS_KEY \
              -e SELFIE_FEEDBACK_KMS_KEY_ID \
              web python manage.py verify_selfie_feedback_storage --confirm-real-storage

  configure-monitoring-agent:
    name: Configure staging Unified Agent
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.configure_monitoring_agent }}
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Copy Unified Agent configuration
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_KEY }}
          source: deploy/configure-monitoring-agent.sh,deploy/monitoring
          target: /opt/photo-prjct/
      - name: Configure staging Unified Agent
        uses: appleboy/ssh-action@v1.0.3
        env:
          YANDEX_CLOUD_FOLDER_ID: ${{ vars.YANDEX_CLOUD_FOLDER_ID }}
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_KEY }}
          envs: YANDEX_CLOUD_FOLDER_ID
          script_stop: true
          script: sudo sh /opt/photo-prjct/deploy/configure-monitoring-agent.sh --folder-id "$YANDEX_CLOUD_FOLDER_ID"
