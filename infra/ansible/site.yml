---
- name: Prepare one FindMe Photo recovery host
  hosts: recovery
  become: true
  gather_facts: false
  pre_tasks:
    - name: Wait for SSH and privilege escalation
      ansible.builtin.wait_for_connection:
        timeout: 300
        connect_timeout: 10
        sleep: 5
    - name: Gather host facts
      ansible.builtin.setup: {}
  roles:
    - host
    - monitoring
