services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: ${DB_NAME:-app}
      POSTGRES_USER: ${DB_USER:-app}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-app}
    ports:
      - "127.0.0.1:${DB_HOST_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped

  web:
    build: .
    command: python manage.py runserver 0.0.0.0:8000
    working_dir: /app/src/backend
    volumes:
      - .:/app
    ports:
      - "127.0.0.1:${WEB_HOST_PORT:-8000}:8000"
    depends_on:
      - db
    env_file:
      - path: .env
        required: false
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    profiles:
      - worker
    environment:
      PHOTO_WORKER_API_URL: http://web:8000/internal/photo-processing/v1
      PHOTO_WORKER_TOKEN: ${PHOTO_PROCESSING_WORKER_TOKEN:-}
      PHOTO_WORKER_BUILD: ${PHOTO_WORKER_BUILD:-capture-metadata-v1}
      PHOTO_WORKER_LEASE_SECONDS: ${PHOTO_WORKER_LEASE_SECONDS:-120}
      PHOTO_WORKER_PROCESSOR_IDENTITIES: ${PHOTO_WORKER_PROCESSOR_IDENTITIES:-1/capture_metadata/2,2/generate_preview/1,2/face_embedding/3,3/face_embedding/5,1/selfie_query/2}
      PHOTO_WORKER_PROCESSOR_TYPES: ${PHOTO_WORKER_PROCESSOR_TYPES:-selfie_query,face_embedding,capture_metadata,generate_preview}
    depends_on:
      - web
    restart: unless-stopped

  commerce-worker:
    build: .
    entrypoint: ["python", "manage.py", "run_commerce_worker"]
    command: []
    working_dir: /app/src/backend
    volumes:
      - .:/app
    profiles:
      - commerce
    environment:
      SECRET_KEY: ${SECRET_KEY:-change-me}
      DEBUG: ${DEBUG:-False}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-localhost,127.0.0.1,web}
      DB_NAME: ${DB_NAME:-app}
      DB_USER: ${DB_USER:-app}
      DB_PASSWORD: ${DB_PASSWORD:-app}
      DB_HOST: db
      DB_PORT: "5432"
      PUBLIC_DOMAIN: ${PUBLIC_DOMAIN:-example.com}
      COMMERCE_PUBLIC_ORIGIN: ${COMMERCE_PUBLIC_ORIGIN:-}
      COMMERCE_PAYMENT_GATEWAY_FACTORY: ${COMMERCE_PAYMENT_GATEWAY_FACTORY:-}
      COMMERCE_EMAIL_SENDER_FACTORY: ${COMMERCE_EMAIL_SENDER_FACTORY:-}
      COMMERCE_WORKER_FACTORY: ${COMMERCE_WORKER_FACTORY:-}
      COMMERCE_EMAIL_FROM_ADDRESS: ${COMMERCE_EMAIL_FROM_ADDRESS:-}
      COMMERCE_POSTBOX_API_KEY_ID: ${COMMERCE_POSTBOX_API_KEY_ID:-}
      COMMERCE_POSTBOX_API_KEY_SECRET: ${COMMERCE_POSTBOX_API_KEY_SECRET:-}
      COMMERCE_ORDER_ACCESS_SIGNING_SECRET: ${COMMERCE_ORDER_ACCESS_SIGNING_SECRET:-}
      COMMERCE_SUPPORT_CONTACT: ${COMMERCE_SUPPORT_CONTACT:-}
      COMMERCE_WORKER_HEALTH_MAX_READY_AGE_SECONDS: ${COMMERCE_WORKER_HEALTH_MAX_READY_AGE_SECONDS:-300}
      COMMERCE_WORKER_ENABLED: ${COMMERCE_WORKER_ENABLED:-False}
    depends_on:
      - db
    restart: unless-stopped

volumes:
  pgdata:
