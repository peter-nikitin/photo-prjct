name: Face-embedding benchmark

on:
  workflow_dispatch:
    inputs:
      operation:
        description: Create a baseline cohort, replay a closed cohort, or print a closed report
        required: true
        type: choice
        options:
          - baseline
          - replay
          - report
      event_slug:
        description: Event slug; required only for the baseline operation
        required: false
        type: string
      source_run_uuid:
        description: Closed baseline or replay run UUID; required for replay and report
        required: false
        type: string

jobs:
  benchmark:
    name: Run bounded benchmark operation
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    concurrency:
      group: deploy
      cancel-in-progress: false
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Run bounded benchmark operation
        env:
          BENCHMARK_OPERATION: ${{ inputs.operation }}
          BENCHMARK_EVENT_SLUG: ${{ inputs.event_slug }}
          BENCHMARK_SOURCE_RUN_UUID: ${{ inputs.source_run_uuid }}
          VM_HOST: ${{ vars.VM_HOST }}
          VM_USER: ${{ vars.VM_USER }}
          VM_SSH_KNOWN_HOSTS: ${{ vars.VM_SSH_KNOWN_HOSTS }}
        run: |
          python scripts/run-with-environment-secrets.py \
            \
            --consumer remote-check \
            --identity github-oidc \
            -- deploy/run-remote.sh face-embedding-benchmark
