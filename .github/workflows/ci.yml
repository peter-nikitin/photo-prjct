name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  quality:
    name: Quality checks
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: app
          POSTGRES_USER: app
          POSTGRES_PASSWORD: app
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U app -d app"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      SECRET_KEY: ci-not-a-secret
      DEBUG: "False"
      ALLOWED_HOSTS: localhost,127.0.0.1
      DB_NAME: app
      DB_USER: app
      DB_PASSWORD: app
      DB_HOST: localhost
      DB_PORT: "5432"
      TEST_DB_NAME: findme_test_${{ github.run_id }}_${{ github.run_attempt }}
      PHOTO_PROCESSING_ENABLED: "True"
      PHOTO_PROCESSING_FACE_ENABLED: "True"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            src/backend/requirements.txt
            src/worker/requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt -r src/worker/requirements.txt

      - name: Static analysis
        run: make static RUFF=ruff MYPY=mypy

      - name: Test with coverage
        run: pytest --cov --cov-report=term-missing

      - name: Run Django system checks
        run: python src/backend/manage.py check

      - name: Check migration drift
        run: python src/backend/manage.py makemigrations --check --dry-run

      - name: Check migration immutability
        if: github.event_name == 'pull_request'
        run: >-
          python scripts/check_migration_immutability.py
          --base ${{ github.event.pull_request.base.sha }}
          --head ${{ github.event.pull_request.head.sha }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install visual test dependencies
        run: npm ci

      - name: Run JavaScript unit tests
        run: npm run test:js

      - name: Log in to GHCR for visual tests
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Run containerized visual regression tests
        run: npm run test:visual
        env:
          VISUAL_TEST_IMAGE_PREFIX: ghcr.io/${{ github.repository }}-visual-tests

      - name: Upload visual test artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: visual-test-artifacts
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
