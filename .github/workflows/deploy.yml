name: Deploy

on:
  workflow_dispatch:
    inputs:
      deploy:
        description: "Deploy from main after building images"
        type: boolean
        default: false
  workflow_call:
    inputs:
      web: {type: boolean, required: true}
      worker: {type: boolean, required: true}
      importer: {type: boolean, required: true}
      commerce: {type: boolean, required: true}
      exporter: {type: boolean, required: true}

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  build:
    if: ${{ github.event_name == 'workflow_dispatch' || inputs.web || inputs.worker || inputs.importer || inputs.commerce }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      app: ${{ steps.web.outputs.digest }}
      worker: ${{ steps.worker.outputs.digest }}
      import: ${{ steps.import.outputs.digest }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Free disk space for image builds
        run: |
          df -h /
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc
          df -h /
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      - name: Build application
        if: ${{ github.event_name == 'workflow_dispatch' || inputs.web || inputs.commerce }}
        id: web
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository }}:${{ github.sha }}
          build-args: RELEASE_SHA=${{ github.sha }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web,ignore-error=true
      - name: Build import worker
        if: ${{ github.event_name == 'workflow_dispatch' || inputs.importer }}
        id: import
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.import-worker
          push: true
          tags: ghcr.io/${{ github.repository }}-import-worker:${{ github.sha }}
          cache-from: type=gha,scope=import-worker
          cache-to: type=gha,mode=max,scope=import-worker,ignore-error=true
      - name: Build worker base
        if: ${{ github.event_name == 'workflow_dispatch' || inputs.worker }}
        id: base
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.worker-base
          push: true
          tags: ghcr.io/${{ github.repository }}-worker-base:${{ github.sha }}
          cache-from: type=gha,scope=worker-base
          cache-to: type=gha,mode=max,scope=worker-base,ignore-error=true
      - name: Build photo worker
        if: ${{ github.event_name == 'workflow_dispatch' || inputs.worker }}
        id: worker
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.worker
          push: true
          tags: ghcr.io/${{ github.repository }}-worker:${{ github.sha }}
          build-args: |
            RELEASE_SHA=${{ github.sha }}
            WORKER_BASE_IMAGE=ghcr.io/${{ github.repository }}-worker-base@${{ steps.base.outputs.digest }}
          cache-from: type=gha,scope=worker
          cache-to: type=gha,mode=max,scope=worker,ignore-error=true

  deploy:
    if: ${{ github.ref == 'refs/heads/main' && needs.build.result == 'success' && (github.event_name == 'push' || inputs.deploy) }}
    needs: [build]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Deploy application
        env:
          FINDME_DEPLOY_SSH_PUBLIC_KEY: ${{ vars.INFRA_SSH_PUBLIC_KEY }}
          VM_HOST: ${{ vars.VM_HOST }}
          VM_USER: ${{ vars.VM_USER }}
          VM_SSH_KNOWN_HOSTS: ${{ vars.VM_SSH_KNOWN_HOSTS }}
          APP_IMAGE: ${{ needs.build.outputs.app && format('ghcr.io/{0}@{1}', github.repository, needs.build.outputs.app) || '' }}
          PHOTO_WORKER_IMAGE: ${{ needs.build.outputs.worker && format('ghcr.io/{0}-worker@{1}', github.repository, needs.build.outputs.worker) || '' }}
          IMPORT_WORKER_IMAGE: ${{ needs.build.outputs.import && format('ghcr.io/{0}-import-worker@{1}', github.repository, needs.build.outputs.import) || '' }}
          PHOTO_IMPORT_ENABLED: ${{ vars.PHOTO_IMPORT_ENABLED || 'False' }}
          PHOTO_IMPORT_BUILD: ${{ github.sha }}
          DEBUG: "False"
          ALLOWED_HOSTS: ${{ vars.ALLOWED_HOSTS }}
          GUNICORN_WORKERS: ${{ vars.GUNICORN_WORKERS || '1' }}
          GUNICORN_TIMEOUT: ${{ vars.GUNICORN_TIMEOUT || '180' }}
          GUNICORN_MAX_REQUESTS: ${{ vars.GUNICORN_MAX_REQUESTS || '0' }}
          GUNICORN_MAX_REQUESTS_JITTER: ${{ vars.GUNICORN_MAX_REQUESTS_JITTER || '0' }}
          DB_NAME: ${{ vars.DB_NAME }}
          DB_USER: ${{ vars.DB_USER }}
          PUBLIC_DOMAIN: ${{ vars.PUBLIC_DOMAIN }}
          PUBLIC_DOMAIN_ALIAS: ${{ vars.PUBLIC_DOMAIN_ALIAS }}
          GALLERY_CDN_ORIGIN: ${{ vars.GALLERY_CDN_ORIGIN || 'https://img.findme-photo.ru' }}
          MEDIA_STORAGE_BACKEND: ${{ vars.MEDIA_STORAGE_BACKEND || 'filesystem' }}
          MEDIA_S3_ENDPOINT_URL: ${{ vars.MEDIA_S3_ENDPOINT_URL || 'https://storage.yandexcloud.net' }}
          MEDIA_S3_REGION: ${{ vars.MEDIA_S3_REGION || 'ru-central1' }}
          MEDIA_S3_PUBLIC_BUCKET: ${{ vars.MEDIA_S3_PUBLIC_BUCKET }}
          PHOTO_UPLOAD_ENABLED: ${{ vars.PHOTO_UPLOAD_ENABLED || 'False' }}
          PRIVATE_MEDIA_S3_BUCKET: ${{ vars.PRIVATE_MEDIA_S3_BUCKET }}
          PRIVATE_MEDIA_ALLOWED_ORIGINS: ${{ vars.PRIVATE_MEDIA_ALLOWED_ORIGINS }}
          PHOTO_PROCESSING_ENABLED: ${{ vars.PHOTO_PROCESSING_ENABLED || 'True' }}
          PHOTO_PROCESSING_PREVIEW_ENABLED: ${{ vars.PHOTO_PROCESSING_PREVIEW_ENABLED || 'True' }}
          PHOTO_PROCESSING_FACE_ENABLED: ${{ vars.PHOTO_PROCESSING_FACE_ENABLED || 'True' }}
          PHOTO_PROCESSING_DOWNLOAD_TTL_SECONDS: ${{ vars.PHOTO_PROCESSING_DOWNLOAD_TTL_SECONDS || '120' }}
          PHOTO_PROCESSING_MAX_REQUEST_BYTES: ${{ vars.PHOTO_PROCESSING_MAX_REQUEST_BYTES || '393216' }}
          PHOTO_WORKER_LEASE_SECONDS: ${{ vars.PHOTO_WORKER_LEASE_SECONDS || '120' }}
          SELFIE_SEARCH_MAX_UPLOAD_BYTES: ${{ vars.SELFIE_SEARCH_MAX_UPLOAD_BYTES || '20971520' }}
          SELFIE_SEARCH_MAX_PIXELS: ${{ vars.SELFIE_SEARCH_MAX_PIXELS || '25000000' }}
          SELFIE_SEARCH_DOWNLOAD_TTL_SECONDS: ${{ vars.SELFIE_SEARCH_DOWNLOAD_TTL_SECONDS || '120' }}
          SELFIE_SEARCH_TEMPORARY_PREFIX: ${{ vars.SELFIE_SEARCH_TEMPORARY_PREFIX || 'selfie-search/' }}
          SELFIE_SEARCH_LIFECYCLE_MAX_AGE_HOURS: ${{ vars.SELFIE_SEARCH_LIFECYCLE_MAX_AGE_HOURS || '24' }}
          SELFIE_FEEDBACK_ENABLED: ${{ vars.SELFIE_FEEDBACK_ENABLED || 'False' }}
          SELFIE_FEEDBACK_S3_BUCKET: ${{ vars.SELFIE_FEEDBACK_S3_BUCKET }}
          SELFIE_FEEDBACK_S3_ENDPOINT_URL: ${{ vars.SELFIE_FEEDBACK_S3_ENDPOINT_URL || 'https://storage.yandexcloud.net' }}
          SELFIE_FEEDBACK_S3_REGION: ${{ vars.SELFIE_FEEDBACK_S3_REGION || 'ru-central1' }}
          SELFIE_FEEDBACK_KMS_KEY_ID: ${{ vars.SELFIE_FEEDBACK_KMS_KEY_ID }}
          SELFIE_FEEDBACK_STORAGE_PREFLIGHT_CONFIRMED: ${{ vars.SELFIE_FEEDBACK_STORAGE_PREFLIGHT_CONFIRMED || 'False' }}
          COMMERCE_WORKER_ENABLED: ${{ vars.COMMERCE_WORKER_ENABLED || 'False' }}
          COMMERCE_PUBLIC_ORIGIN: ${{ vars.COMMERCE_PUBLIC_ORIGIN || 'https://findme-photo.ru' }}
          COMMERCE_PAYMENT_GATEWAY_FACTORY: ${{ vars.COMMERCE_PAYMENT_GATEWAY_FACTORY || 'commerce.payment_simulator.payment_simulator_gateway_factory' }}
          TBANK_API_ORIGIN: ${{ vars.TBANK_API_ORIGIN || '' }}
          TBANK_RUB_ONLY: ${{ vars.TBANK_RUB_ONLY || '' }}
          TBANK_PAY_TYPE: ${{ vars.TBANK_PAY_TYPE || '' }}
          TBANK_RECEIPT_FFD: ${{ vars.TBANK_RECEIPT_FFD || '' }}
          TBANK_RECEIPT_TAXATION: ${{ vars.TBANK_RECEIPT_TAXATION || '' }}
          TBANK_RECEIPT_TAX: ${{ vars.TBANK_RECEIPT_TAX || '' }}
          TBANK_RECEIPT_PAYMENT_METHOD: ${{ vars.TBANK_RECEIPT_PAYMENT_METHOD || '' }}
          TBANK_RECEIPT_PAYMENT_OBJECT: ${{ vars.TBANK_RECEIPT_PAYMENT_OBJECT || '' }}
          TBANK_RECEIPT_MEASUREMENT_UNIT: ${{ vars.TBANK_RECEIPT_MEASUREMENT_UNIT || '' }}
          TBANK_RECEIPT_CLOSING_REQUIRED: ${{ vars.TBANK_RECEIPT_CLOSING_REQUIRED || '' }}
          COMMERCE_EMAIL_SENDER_FACTORY: ${{ vars.COMMERCE_EMAIL_SENDER_FACTORY || 'commerce.postbox_email_sender.postbox_email_sender_factory' }}
          COMMERCE_WORKER_FACTORY: ${{ vars.COMMERCE_WORKER_FACTORY || 'commerce.runtime.commerce_worker_factory' }}
          COMMERCE_EMAIL_FROM_ADDRESS: ${{ vars.COMMERCE_EMAIL_FROM_ADDRESS || 'orders@findme-photo.ru' }}
          COMMERCE_SUPPORT_CONTACT: ${{ vars.COMMERCE_SUPPORT_CONTACT || 'support@findme-photo.ru' }}
          COMMERCE_WORKER_HEALTH_MAX_READY_AGE_SECONDS: ${{ vars.COMMERCE_WORKER_HEALTH_MAX_READY_AGE_SECONDS || '300' }}
          GHCR_USERNAME: ${{ vars.GHCR_USERNAME }}
          DEPLOY_WEB: ${{ github.event_name == 'workflow_dispatch' || inputs.web }}
          DEPLOY_WORKER: ${{ github.event_name == 'workflow_dispatch' || inputs.worker }}
          DEPLOY_IMPORT: ${{ github.event_name == 'workflow_dispatch' || inputs.importer }}
          DEPLOY_COMMERCE: ${{ github.event_name == 'workflow_dispatch' || inputs.commerce }}
        run: |
          python scripts/run-with-environment-secrets.py --consumer deploy --identity github-oidc -- deploy/run-remote.sh deploy
  monitoring:
    needs: [build, deploy]
    if: >-
      always() && github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || inputs.deploy) &&
      (inputs.exporter || github.event_name == 'workflow_dispatch') &&
      (needs.deploy.result == 'success' || (needs.build.result == 'skipped' && needs.deploy.result == 'skipped'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Start private PostgreSQL monitoring after application release
        env:
          FINDME_DEPLOY_SSH_PUBLIC_KEY: ${{ vars.INFRA_SSH_PUBLIC_KEY }}
          VM_HOST: ${{ vars.VM_HOST }}
          VM_USER: ${{ vars.VM_USER }}
          VM_SSH_KNOWN_HOSTS: ${{ vars.VM_SSH_KNOWN_HOSTS }}
          FINDME_DEPLOY_MODE: monitoring
        run: |
          python scripts/run-with-environment-secrets.py --consumer monitoring-deploy --identity github-oidc -- deploy/run-remote.sh deploy

  verify-application-metrics:
    needs: [deploy, monitoring]
    if: >-
      always() && github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || inputs.deploy) &&
      ((needs.deploy.result == 'success' &&
        (needs.monitoring.result == 'success' || needs.monitoring.result == 'skipped')) ||
       (needs.deploy.result == 'skipped' && needs.monitoring.result == 'success'))
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/verify-metrics.yml
    with:
      scope: application
