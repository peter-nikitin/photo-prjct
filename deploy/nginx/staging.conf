server_tokens off;

map $uri $selfie_search_access_request {
    default $request;
    ~^/events/[^/]+/selfie-search/[^/]+(?:/|$) "$request_method <selfie-search>";
}

map $uri $selfie_search_access_referrer {
    default $http_referer;
    ~^/events/[^/]+/selfie-search/[^/]+(?:/|$) "-";
}

map $uri $selfie_search_access_user_agent {
    default $http_user_agent;
    ~^/events/[^/]+/selfie-search/[^/]+(?:/|$) "-";
}

log_format selfie_search_safe '$remote_addr - $remote_user [$time_local] '
    '"$selfie_search_access_request" $status $body_bytes_sent '
    '"$selfie_search_access_referrer" "$selfie_search_access_user_agent"';

upstream django_upstream {
    server web:8000;
}

server {
    listen 80;
    listen [::]:80;
    server_name _;
    access_log /var/log/nginx/access.log selfie_search_safe;

    proxy_hide_header Referrer-Policy;
    add_header Referrer-Policy "no-referrer" always;

    # Keep the private worker control plane off the public staging listener.
    location ^~ /internal/photo-processing/ {
        return 404;
    }

    # Bearer URLs are secrets. Do not persist a raw request URI if this upstream is unavailable.
    location ~ ^/events/[^/]+/selfie-search/[^/]+(?:/|$) {
        error_log /dev/null emerg;

        proxy_pass http://django_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto http;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location / {
        proxy_pass http://django_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto http;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
