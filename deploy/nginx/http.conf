server_tokens off;
error_log /dev/null crit;

# Avoid recording bearer URLs and personal request metadata in access logs.
map $uri $safe_request {
    default $request;
    ~^/events/[^/]+/selfie-search(?:/|$) "$request_method <selfie-search>";
    ~^/orders/[^/]+/access/[^/]+/[^/]+(?:/|$) "$request_method <order-access>";
    ~^/orders/[^/]+/download/$ "$request_method <order-archive>";
}
map $uri $safe_address {
    default $remote_addr;
    ~^/events/[^/]+/selfie-search(?:/|$) "-";
    ~^/orders/[^/]+/access/[^/]+/[^/]+(?:/|$) "-";
    ~^/orders/[^/]+/download/$ "-";
}
log_format safe '$safe_address - - [$time_local] "$safe_request" $status $body_bytes_sent';

server {
    listen 80 default_server;
    server_name _;
    access_log /var/log/nginx/access.log safe;
    error_log /dev/null emerg;
    client_max_body_size 25m;

    location ^~ /.well-known/acme-challenge/ { root /var/www/certbot; }
    location ^~ /internal/ { return 404; }
    location = /metrics/ { return 404; }
    location ^~ /worker-diagnostics/ { return 404; }

    location / {
        proxy_pass http://web:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto http;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}

server {
    listen 8081;
    server_name _;
    access_log off;
    location = /health/ {
        proxy_pass http://web:8000/health/;
        proxy_set_header Host localhost;
    }
    location / { return 404; }
}
