name: Deploy staging

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      verify_private_storage:
        description: Run the confirmed real-storage contract probe after disabled deployment
        required: true
        default: false
        type: boolean
      verify_selfie_search_storage:
        description: Run the confirmed selfie-search temporary-storage preflight after disabled deployment
        required: true
        default: false
        type: boolean
      configure_monitoring_agent:
        description: Configure the staging Yandex Unified Agent without deploying the application
        required: true
        default: false
        type: boolean
      verify_selfie_feedback_storage:
        description: Run the confirmed dedicated feedback-storage preflight while feedback remains disabled
        required: true
        default: false
        type: boolean
      validate_deploy_issue:
        description: Exercise the bounded staging deployment issue notification drill
        required: true
        default: false
        type: boolean
      deployment_sha:
        description: Exact 40-character commit SHA to deploy manually
        required: false
        default: ""
        type: string
      verify_paused_observability_release:
        description: Verify the staged privileged package for deployment_sha before deployment
        required: true
        default: false
        type: boolean
      preflight:
        description: Validate all staging Lockbox projections without mutating staging
        required: true
        default: false
        type: boolean

jobs:
  classify-staging-release:
    name: Classify staging release
    if: ${{ !inputs.preflight }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      requires_observability_bootstrap: ${{ steps.classify.outputs.requires_observability_bootstrap }}
      observability_source_manifest_sha256: ${{ steps.classify.outputs.observability_source_manifest_sha256 }}
      release_sha: ${{ steps.classify.outputs.release_sha }}
    steps:
      - name: Check out push range
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Classify staging release
        id: classify
        env:
          DEPLOYMENT_SHA: ${{ inputs.deployment_sha }}
        run: |
          set -eu
          release_sha="${{ github.sha }}"
          requires_observability_bootstrap=false
          manifest_sha256=
          pause_reason=
          if [ "${{ github.event_name }}" = workflow_dispatch ] && \
             [ "${{ inputs.configure_monitoring_agent }}" != true ] && \
             [ "${{ inputs.validate_deploy_issue }}" != true ]; then
            release_sha="$DEPLOYMENT_SHA"
            if [ "${#release_sha}" -ne 40 ] || [ -n "$(printf '%s' "$release_sha" | tr -d '0-9a-fA-F')" ]; then
              echo "deployment_sha must be an exact 40-character commit SHA" >&2
              exit 2
            fi
            release_sha="$(printf '%s' "$release_sha" | tr 'A-F' 'a-f')"
            git cat-file -e "$release_sha^{commit}" || {
              echo "deployment_sha must identify an available commit" >&2
              exit 2
            }
            test "$(git rev-parse "$release_sha^{commit}")" = "$release_sha" || {
              echo "deployment_sha must identify the commit object exactly" >&2
              exit 2
            }
          elif [ "${{ github.event_name }}" = push ]; then
            if [ "${{ github.event.before }}" = 0000000000000000000000000000000000000000 ]; then
              requires_observability_bootstrap=true
              pause_reason="Privileged package change status is unknown because the push base is unavailable."
            elif ! git diff --quiet "${{ github.event.before }}..${{ github.sha }}" -- deploy/bootstrap-selfie-observability.sh 'deploy/selfie-observability/**'; then
              requires_observability_bootstrap=true
              pause_reason="Commit ${GITHUB_SHA} changes the privileged selfie-observability package."
            fi
          fi

          if [ "$requires_observability_bootstrap" = true ] || \
             [ "${{ inputs.verify_paused_observability_release }}" = true ]; then
            git ls-tree -r --name-only "$release_sha" -- \
              deploy/bootstrap-selfie-observability.sh deploy/selfie-observability \
              | while IFS= read -r source_path; do
                  source_digest="$(git show "$release_sha:$source_path" | sha256sum | cut -d ' ' -f 1)"
                  printf '%s  %s\n' "$source_digest" "$source_path"
                done \
              > staging-observability-source.sha256
            manifest_sha256="$(sha256sum staging-observability-source.sha256 | cut -d ' ' -f 1)"
          fi
          echo "release_sha=$release_sha" >> "$GITHUB_OUTPUT"
          echo "requires_observability_bootstrap=$requires_observability_bootstrap" >> "$GITHUB_OUTPUT"
          echo "observability_source_manifest_sha256=$manifest_sha256" >> "$GITHUB_OUTPUT"
          if [ "$requires_observability_bootstrap" = true ]; then
            {
              echo "## Staging release paused"
              echo "Commit: ${GITHUB_SHA}. ${pause_reason}"
              echo
              echo "An operator must complete these reviewed actions before manually running the Deploy staging workflow:"
              echo "1. Wait for the Stage paused observability source job to succeed, then run: ssh -l petrnikitin 111.88.151.64"
              echo "2. cd /opt/photo-prjct/privileged-observability-releases/${GITHUB_SHA}"
              echo "3. test \"\$(cat staging-observability-release-sha)\" = \"${GITHUB_SHA}\""
              echo "4. printf '%s  staging-observability-source.sha256\\n' '${manifest_sha256}' | sha256sum --check -"
              echo "5. sha256sum --check staging-observability-source.sha256"
              echo "6. DEPLOY_ROOT=/opt/photo-prjct/privileged-observability-releases/${GITHUB_SHA} sh /opt/photo-prjct/privileged-observability-releases/${GITHUB_SHA}/deploy/bootstrap-selfie-observability.sh"
              echo "7. sudo /usr/local/sbin/findme-selfie-observability verify"
              echo "8. gh workflow run deploy.yml --ref main -f deployment_sha=${GITHUB_SHA} -f verify_paused_observability_release=true"
            } >> "$GITHUB_STEP_SUMMARY"
          fi

  stage-observability-release:
    name: Stage paused observability source
    if: ${{ github.event_name == 'push' && needs.classify-staging-release.outputs.requires_observability_bootstrap == 'true' && !inputs.preflight }}
    runs-on: ubuntu-latest
    needs: [classify-staging-release]
    environment: staging
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out paused commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Bind staged source to paused commit
        run: |
          set -eu
          release_sha="${{ github.sha }}"
          test "$(git rev-parse HEAD)" = "$release_sha"
          printf '%s\n' "$release_sha" > staging-observability-release-sha
      - name: Create staged source manifest
        run: |
          set -eu
          git ls-tree -r --name-only "${{ github.sha }}" -- \
            deploy/bootstrap-selfie-observability.sh deploy/selfie-observability \
            | while IFS= read -r source_path; do sha256sum "$source_path"; done \
            > staging-observability-source.sha256
          manifest_sha256="$(sha256sum staging-observability-source.sha256 | cut -d ' ' -f 1)"
          test "$manifest_sha256" = "${{ needs.classify-staging-release.outputs.observability_source_manifest_sha256 }}"
      - name: Stage privileged observability source
        env:
          STAGING_VM_HOST: ${{ vars.VM_HOST }}
          STAGING_VM_USER: ${{ vars.VM_USER }}
          STAGING_SSH_KNOWN_HOSTS: ${{ vars.STAGING_SSH_KNOWN_HOSTS }}
          RELEASE_SHA: ${{ github.sha }}
          OBSERVABILITY_SOURCE_MANIFEST_SHA256: ${{ needs.classify-staging-release.outputs.observability_source_manifest_sha256 }}
        run: |
          python scripts/run-with-environment-secrets.py \
            --environment staging \
            --consumer staging-remote-check \
            --identity github-oidc \
            -- deploy/run-staging-remote.sh stage-paused-observability-release

  build:
    name: Build immutable image
    if: ${{ (github.event_name == 'push' && needs.classify-staging-release.outputs.requires_observability_bootstrap == 'false') || (github.event_name == 'workflow_dispatch' && !inputs.configure_monitoring_agent && !inputs.validate_deploy_issue && !inputs.preflight) }}
    runs-on: ubuntu-latest
    needs: [classify-staging-release]
    permissions:
      contents: read
      packages: write
    outputs:
      app_image: ${{ steps.image.outputs.app_image }}
      worker_image: ${{ steps.image.outputs.worker_image }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.classify-staging-release.outputs.release_sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Select image references
        id: image
        run: |
          release_sha="${{ needs.classify-staging-release.outputs.release_sha }}"
          echo "app_image=ghcr.io/${GITHUB_REPOSITORY}:${release_sha}" >> "$GITHUB_OUTPUT"
          echo "worker_image=ghcr.io/${GITHUB_REPOSITORY}-worker:${release_sha}" >> "$GITHUB_OUTPUT"
      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.image.outputs.app_image }}
      - name: Build and push worker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.worker
          push: true
          tags: ${{ steps.image.outputs.worker_image }}

  deploy:
    name: Deploy staging
    if: ${{ (github.event_name == 'push' && needs.classify-staging-release.outputs.requires_observability_bootstrap == 'false') || (github.event_name == 'workflow_dispatch' && !inputs.configure_monitoring_agent && !inputs.validate_deploy_issue && !inputs.preflight) }}
    runs-on: ubuntu-latest
    needs: [classify-staging-release, build]
    environment: staging
    permissions:
      contents: read
      id-token: write
    concurrency:
      group: deploy-staging
      cancel-in-progress: false
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.classify-staging-release.outputs.release_sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Verify staged paused observability release
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.verify_paused_observability_release }}
        env:
          STAGING_VM_HOST: ${{ vars.VM_HOST }}
          STAGING_VM_USER: ${{ vars.VM_USER }}
          STAGING_SSH_KNOWN_HOSTS: ${{ vars.STAGING_SSH_KNOWN_HOSTS }}
          RELEASE_SHA: ${{ needs.classify-staging-release.outputs.release_sha }}
          OBSERVABILITY_SOURCE_MANIFEST_SHA256: ${{ needs.classify-staging-release.outputs.observability_source_manifest_sha256 }}
        run: |
          python scripts/run-with-environment-secrets.py \
            --environment staging \
            --consumer staging-remote-check \
            --identity github-oidc \
            -- deploy/run-staging-remote.sh verify-paused-observability-release
      - name: Run staging deployment
        env:
          STAGING_VM_HOST: ${{ vars.VM_HOST }}
          STAGING_VM_USER: ${{ vars.VM_USER }}
          STAGING_SSH_KNOWN_HOSTS: ${{ vars.STAGING_SSH_KNOWN_HOSTS }}
          DEPLOYMENT_TARGET: staging
          APP_IMAGE: ${{ needs.build.outputs.app_image }}
          WORKER_IMAGE: ${{ needs.build.outputs.worker_image }}
          DEBUG: "False"
          ALLOWED_HOSTS: ${{ vars.ALLOWED_HOSTS }}
          GUNICORN_WORKERS: '5'
          GUNICORN_THREADS: '2'
          GUNICORN_TIMEOUT: '180'
          GUNICORN_MAX_REQUESTS: '1000'
          GUNICORN_MAX_REQUESTS_JITTER: '100'
          DB_NAME: ${{ vars.DB_NAME }}
          DB_USER: ${{ vars.DB_USER }}
          PUBLIC_DOMAIN: ${{ vars.PUBLIC_DOMAIN }}
          PUBLIC_DOMAIN_ALIAS: ${{ vars.PUBLIC_DOMAIN_ALIAS }}
          MEDIA_STORAGE_BACKEND: ${{ vars.MEDIA_STORAGE_BACKEND || 'filesystem' }}
          MEDIA_S3_ENDPOINT_URL: ${{ vars.MEDIA_S3_ENDPOINT_URL || 'https://storage.yandexcloud.net' }}
          MEDIA_S3_REGION: ${{ vars.MEDIA_S3_REGION || 'ru-central1' }}
          MEDIA_S3_PUBLIC_BUCKET: ${{ vars.MEDIA_S3_PUBLIC_BUCKET }}
          PHOTO_UPLOAD_ENABLED: ${{ vars.PHOTO_UPLOAD_ENABLED || 'False' }}
          PRIVATE_MEDIA_S3_BUCKET: ${{ vars.PRIVATE_MEDIA_S3_BUCKET }}
          PRIVATE_MEDIA_ALLOWED_ORIGINS: ${{ vars.PRIVATE_MEDIA_ALLOWED_ORIGINS }}
          PHOTO_PROCESSING_ENABLED: ${{ vars.PHOTO_PROCESSING_ENABLED || 'False' }}
          PHOTO_PROCESSING_PREVIEW_ENABLED: ${{ vars.PHOTO_PROCESSING_PREVIEW_ENABLED || 'False' }}
          PHOTO_PROCESSING_FACE_ENABLED: ${{ vars.PHOTO_PROCESSING_FACE_ENABLED || 'False' }}
          PHOTO_PROCESSING_DOWNLOAD_TTL_SECONDS: ${{ vars.PHOTO_PROCESSING_DOWNLOAD_TTL_SECONDS || '120' }}
          PHOTO_PROCESSING_MAX_REQUEST_BYTES: ${{ vars.PHOTO_PROCESSING_MAX_REQUEST_BYTES || '131072' }}
          PHOTO_WORKER_BUILD: ${{ vars.PHOTO_WORKER_BUILD || 'capture-metadata-v1' }}
          PHOTO_WORKER_LEASE_SECONDS: ${{ vars.PHOTO_WORKER_LEASE_SECONDS || '120' }}
          # Preserve an explicitly configured identity list; otherwise run capture metadata v2.
          # The ordered processor-type contract below still lets the worker poll typed defaults,
          # including selfie_query.
          PHOTO_WORKER_PROCESSOR_IDENTITIES: ${{ vars.PHOTO_WORKER_PROCESSOR_IDENTITIES || '1/capture_metadata/2' }}
          PHOTO_WORKER_PROCESSOR_TYPES: ${{ vars.PHOTO_WORKER_PROCESSOR_TYPES || 'selfie_query,face_embedding,capture_metadata,generate_preview' }}
          PHOTO_WORKER_REPLICAS: ${{ vars.PHOTO_WORKER_REPLICAS || '1' }}
          SELFIE_SEARCH_ENABLED: ${{ vars.SELFIE_SEARCH_ENABLED || 'False' }}
          SELFIE_SEARCH_MAX_UPLOAD_BYTES: ${{ vars.SELFIE_SEARCH_MAX_UPLOAD_BYTES || '20971520' }}
          SELFIE_SEARCH_MAX_PIXELS: ${{ vars.SELFIE_SEARCH_MAX_PIXELS || '25000000' }}
          SELFIE_SEARCH_DOWNLOAD_TTL_SECONDS: ${{ vars.SELFIE_SEARCH_DOWNLOAD_TTL_SECONDS || '120' }}
          SELFIE_SEARCH_EMBEDDING_MODEL: ${{ vars.SELFIE_SEARCH_EMBEDDING_MODEL || 'sface' }}
          SELFIE_SEARCH_EMBEDDING_DIMENSIONS: ${{ vars.SELFIE_SEARCH_EMBEDDING_DIMENSIONS || '128' }}
          SELFIE_SEARCH_COSINE_DISTANCE_THRESHOLD: ${{ vars.SELFIE_SEARCH_COSINE_DISTANCE_THRESHOLD || '0.363' }}
          SELFIE_SEARCH_TEMPORARY_PREFIX: ${{ vars.SELFIE_SEARCH_TEMPORARY_PREFIX || 'selfie-search/' }}
          SELFIE_SEARCH_LIFECYCLE_MAX_AGE_HOURS: ${{ vars.SELFIE_SEARCH_LIFECYCLE_MAX_AGE_HOURS || '24' }}
          SELFIE_FEEDBACK_ENABLED: ${{ vars.SELFIE_FEEDBACK_ENABLED || 'False' }}
          SELFIE_FEEDBACK_S3_BUCKET: ${{ vars.SELFIE_FEEDBACK_S3_BUCKET }}
          SELFIE_FEEDBACK_S3_ENDPOINT_URL: ${{ vars.SELFIE_FEEDBACK_S3_ENDPOINT_URL || 'https://storage.yandexcloud.net' }}
          SELFIE_FEEDBACK_S3_REGION: ${{ vars.SELFIE_FEEDBACK_S3_REGION || 'ru-central1' }}
          SELFIE_FEEDBACK_KMS_KEY_ID: ${{ vars.SELFIE_FEEDBACK_KMS_KEY_ID }}
          SELFIE_FEEDBACK_STORAGE_PREFLIGHT_CONFIRMED: ${{ vars.SELFIE_FEEDBACK_STORAGE_PREFLIGHT_CONFIRMED || 'False' }}
          GHCR_USERNAME: ${{ vars.GHCR_USERNAME }}
        run: |
          python scripts/run-with-environment-secrets.py \
            --environment staging \
            --consumer staging-deploy \
            --identity github-oidc \
            -- deploy/run-staging-remote.sh deploy
      - name: Verify private upload storage contract
        if: ${{ inputs.verify_private_storage }}
        env:
          STAGING_VM_HOST: ${{ vars.VM_HOST }}
          STAGING_VM_USER: ${{ vars.VM_USER }}
          STAGING_SSH_KNOWN_HOSTS: ${{ vars.STAGING_SSH_KNOWN_HOSTS }}
          PRIVATE_MEDIA_ALLOWED_ORIGINS: ${{ vars.PRIVATE_MEDIA_ALLOWED_ORIGINS }}
        run: |
          python scripts/run-with-environment-secrets.py \
            --environment staging \
            --consumer staging-remote-check \
            --identity github-oidc \
            -- deploy/run-staging-remote.sh private-storage
      - name: Verify selfie-search temporary storage contract
        if: ${{ inputs.verify_selfie_search_storage }}
        env:
          STAGING_VM_HOST: ${{ vars.VM_HOST }}
          STAGING_VM_USER: ${{ vars.VM_USER }}
          STAGING_SSH_KNOWN_HOSTS: ${{ vars.STAGING_SSH_KNOWN_HOSTS }}
        run: |
          python scripts/run-with-environment-secrets.py \
            --environment staging \
            --consumer staging-remote-check \
            --identity github-oidc \
            -- deploy/run-staging-remote.sh selfie-storage
      - name: Verify selfie-feedback storage contract
        if: ${{ inputs.verify_selfie_feedback_storage }}
        env:
          STAGING_VM_HOST: ${{ vars.VM_HOST }}
          STAGING_VM_USER: ${{ vars.VM_USER }}
          STAGING_SSH_KNOWN_HOSTS: ${{ vars.STAGING_SSH_KNOWN_HOSTS }}
          SELFIE_FEEDBACK_ENABLED: ${{ vars.SELFIE_FEEDBACK_ENABLED || 'False' }}
          SELFIE_FEEDBACK_S3_BUCKET: ${{ vars.SELFIE_FEEDBACK_S3_BUCKET }}
          SELFIE_FEEDBACK_KMS_KEY_ID: ${{ vars.SELFIE_FEEDBACK_KMS_KEY_ID }}
        run: |
          python scripts/run-with-environment-secrets.py \
            --environment staging \
            --consumer staging-deploy \
            --identity github-oidc \
            -- deploy/run-staging-remote.sh selfie-feedback-storage

  reconcile-staging-deploy-issue:
    name: Reconcile staging deployment issue
    if: ${{ always() && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && !inputs.configure_monitoring_agent && !inputs.validate_deploy_issue && !inputs.preflight)) }}
    runs-on: ubuntu-latest
    needs: [classify-staging-release, build, deploy]
    permissions:
      actions: read
      contents: read
      issues: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Reconcile issue state
        id: reconcile
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ needs.build.result }}" = failure ]; then
            conclusion=failure
            phase=build
          elif [ "${{ needs.deploy.result }}" = success ]; then
            conclusion=success
            phase=commit
          elif [ "${{ needs.deploy.result }}" != failure ]; then
            exit 0
          else
            conclusion=failure
            phase="$(
              gh run view "$GITHUB_RUN_ID" --log-failed 2>/dev/null | awk '
                /(^|[[:space:]])DEPLOY_PHASE=(validate|snapshot|candidate-pull|private-media-preflight|migration-preflight|observability-preflight|observability-reconcile|certificate|compose-reconcile|local-health|worker-health|public-health|observability-verify|commit)$/ {
                  phase = $0
                  sub(/^.*DEPLOY_PHASE=/, "", phase)
                }
                END {
                  if (phase != "") {
                    print phase
                  } else {
                    print "unknown"
                  }
                }
              '
            )"
          fi

          python scripts/reconcile_staging_deploy_issue.py \
            --repository "$GITHUB_REPOSITORY" \
            --token-env GITHUB_TOKEN \
            --mode production \
            --conclusion "$conclusion" \
            --sha "${{ needs.classify-staging-release.outputs.release_sha }}" \
            --run-url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            --phase "$phase"
      - name: Warn when issue reconciliation fails
        if: ${{ steps.reconcile.outcome == 'failure' }}
        run: echo "::warning::Staging deployment issue reconciliation failed; the deployment result remains authoritative."

  validate-staging-deploy-issue:
    name: Validate staging deployment issue notification
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.validate_deploy_issue && !inputs.preflight }}
    runs-on: ubuntu-latest
    environment: staging
    permissions:
      contents: read
      issues: write
    env:
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Create validation issue
        run: |
          python scripts/reconcile_staging_deploy_issue.py \
            --repository "$GITHUB_REPOSITORY" --token-env GITHUB_TOKEN --mode validation \
            --conclusion failure --sha "$GITHUB_SHA" \
            --run-url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            --phase validate
      - name: Update validation issue
        run: |
          python scripts/reconcile_staging_deploy_issue.py \
            --repository "$GITHUB_REPOSITORY" --token-env GITHUB_TOKEN --mode validation \
            --conclusion failure --sha "$GITHUB_SHA" \
            --run-url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            --phase snapshot
      - name: Close validation issue
        run: |
          python scripts/reconcile_staging_deploy_issue.py \
            --repository "$GITHUB_REPOSITORY" --token-env GITHUB_TOKEN --mode validation \
            --conclusion success --sha "$GITHUB_SHA" \
            --run-url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            --phase commit
      - name: Assert validation issue is closed
        run: |
          if gh api \
            "/repos/$GITHUB_REPOSITORY/issues?state=open&per_page=100" \
            --jq '.[] | select((.pull_request | not) and .title == "[staging deployment validation] notification drill") | .number' \
            | grep -q .; then
            echo "Validation issue remains open" >&2
            exit 1
          fi

  configure-monitoring-agent:
    name: Configure staging Unified Agent
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.configure_monitoring_agent && !inputs.validate_deploy_issue && !inputs.preflight }}
    runs-on: ubuntu-latest
    environment: staging
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Configure staging Unified Agent
        env:
          STAGING_VM_HOST: ${{ vars.VM_HOST }}
          STAGING_VM_USER: ${{ vars.VM_USER }}
          STAGING_SSH_KNOWN_HOSTS: ${{ vars.STAGING_SSH_KNOWN_HOSTS }}
          YANDEX_CLOUD_FOLDER_ID: ${{ vars.YANDEX_CLOUD_FOLDER_ID }}
        run: |
          python scripts/run-with-environment-secrets.py \
            --environment staging \
            --consumer staging-remote-check \
            --identity github-oidc \
            -- deploy/run-staging-remote.sh configure-monitoring

  lockbox-preflight:
    name: Validate staging Lockbox projections
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.preflight }}
    runs-on: ubuntu-latest
    environment: staging
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: "Verify Lockbox projection: local-web"
        run: |
          python scripts/run-with-environment-secrets.py \
            --environment staging --consumer local-web --identity github-oidc \
            -- python scripts/verify-environment-secret-projection.py local-web
      - name: "Verify Lockbox projection: staging-deploy"
        run: |
          python scripts/run-with-environment-secrets.py \
            --environment staging --consumer staging-deploy --identity github-oidc \
            -- python scripts/verify-environment-secret-projection.py staging-deploy
      - name: "Verify Lockbox projection: staging-remote-check"
        run: |
          python scripts/run-with-environment-secrets.py \
            --environment staging --consumer staging-remote-check --identity github-oidc \
            -- python scripts/verify-environment-secret-projection.py staging-remote-check
      - name: "Verify Lockbox projection: staging-public-monitor"
        run: |
          python scripts/run-with-environment-secrets.py \
            --environment staging --consumer staging-public-monitor --identity github-oidc \
            -- python scripts/verify-environment-secret-projection.py staging-public-monitor
