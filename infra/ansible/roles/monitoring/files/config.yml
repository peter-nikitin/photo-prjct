storages:
- name: findme_prometheus_buffer
  plugin: fs
  config:
    directory: /var/lib/yandex/unified_agent/findme_prometheus_buffer
    max_partition_size: 100mb
    max_segment_size: 10mb
channels:
- name: findme_prometheus_remote_write
  channel:
    pipe:
    - storage_ref:
        name: findme_prometheus_buffer
    output:
      plugin: metrics
      config:
        url: https://monitoring.api.cloud.yandex.net/prometheus/workspaces/mon0c97qv2s5uju1ark8/api/v1/write
        set_host_label: null
        iam:
          cloud_meta: {}
routes:
- input:
    plugin: linux_metrics
    config:
      poll_period: 60s
      namespace: sys
      prometheus_config:
        job_name: findme-linux
  channel:
    channel_ref:
      name: findme_prometheus_remote_write
    pipe:
    - filter:
        plugin: transform_metric_labels
        config:
          labels:
          - instance: findme-photo-app
- input:
    plugin: metrics_pull
    config:
      url: http://127.0.0.1:8080/metrics/
      format:
        prometheus: {}
      poll_period: 60s
      timeout: 10s
      prometheus_config:
        job_name: findme-http
  channel:
    channel_ref:
      name: findme_prometheus_remote_write
    pipe:
    - filter:
        plugin: transform_metric_labels
        config:
          labels:
          - instance: findme-photo-app
- input:
    plugin: metrics_pull
    config:
      url: http://127.0.0.1:9187/metrics
      format:
        prometheus: {}
      poll_period: 60s
      timeout: 10s
      prometheus_config:
        job_name: findme-postgres
  channel:
    channel_ref:
      name: findme_prometheus_remote_write
    pipe:
    - filter:
        plugin: transform_metric_labels
        config:
          labels:
          - instance: findme-photo-app
- input:
    plugin: metrics_pull
    config:
      url: http://127.0.0.1:9188/metrics
      format:
        prometheus: {}
      poll_period: 60s
      timeout: 10s
      prometheus_config:
        job_name: findme-queue-telemetry
  channel:
    channel_ref:
      name: findme_prometheus_remote_write
    pipe:
    - filter:
        plugin: transform_metric_labels
        config:
          labels:
          - instance: findme-photo-app
