name: Promote production

on:
  workflow_dispatch:
    inputs:
      image_sha:
        description: Commit SHA successfully deployed to staging
        required: true
        type: string

jobs:
  verify-staging:
    name: Verify staging image
    runs-on: ubuntu-latest
    environment: staging
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Confirm image was deployed successfully to staging
        env:
          APP_IMAGE: ghcr.io/${{ github.repository }}:${{ inputs.image_sha }}
          STAGING_VM_HOST: ${{ vars.VM_HOST }}
          STAGING_VM_USER: ${{ vars.VM_USER }}
          STAGING_SSH_KNOWN_HOSTS: ${{ vars.STAGING_SSH_KNOWN_HOSTS }}
        run: |
          python scripts/run-with-environment-secrets.py \
            --environment staging \
            --consumer staging-remote-check \
            --identity github-oidc \
            -- deploy/run-staging-remote.sh verify-staging-image

  promote:
    name: Promote verified image
    runs-on: ubuntu-latest
    needs: verify-staging
    environment: production
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    steps:
      - name: Checkout selected revision
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.image_sha }}
      - name: Copy production deployment files
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_KEY }}
          source: docker-compose.prod.yml,docker-compose.https.yml,deploy
          target: /opt/photo-prjct/
      - name: Apply production deployment
        uses: appleboy/ssh-action@v1.0.3
        env:
          DEPLOYMENT_TARGET: production
          APP_IMAGE: ghcr.io/${{ github.repository }}:${{ inputs.image_sha }}
          SECRET_KEY: ${{ secrets.SECRET_KEY }}
          DEBUG: "False"
          ALLOWED_HOSTS: ${{ secrets.ALLOWED_HOSTS }}
          GUNICORN_WORKERS: '5'
          GUNICORN_THREADS: '2'
          GUNICORN_TIMEOUT: '180'
          GUNICORN_MAX_REQUESTS: '1000'
          GUNICORN_MAX_REQUESTS_JITTER: '100'
          DB_NAME: ${{ secrets.DB_NAME }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          PUBLIC_DOMAIN: ${{ vars.PUBLIC_DOMAIN }}
          PUBLIC_DOMAIN_ALIAS: ${{ vars.PUBLIC_DOMAIN_ALIAS }}
          LETSENCRYPT_EMAIL: ${{ secrets.LETSENCRYPT_EMAIL }}
          MEDIA_STORAGE_BACKEND: ${{ vars.MEDIA_STORAGE_BACKEND || 'filesystem' }}
          MEDIA_S3_ENDPOINT_URL: ${{ vars.MEDIA_S3_ENDPOINT_URL || 'https://storage.yandexcloud.net' }}
          MEDIA_S3_REGION: ${{ vars.MEDIA_S3_REGION || 'ru-central1' }}
          MEDIA_S3_PUBLIC_BUCKET: ${{ vars.MEDIA_S3_PUBLIC_BUCKET }}
          MEDIA_S3_ACCESS_KEY_ID: ${{ secrets.MEDIA_S3_ACCESS_KEY_ID }}
          MEDIA_S3_SECRET_ACCESS_KEY: ${{ secrets.MEDIA_S3_SECRET_ACCESS_KEY }}
          PHOTO_UPLOAD_ENABLED: ${{ vars.PHOTO_UPLOAD_ENABLED || 'False' }}
          PRIVATE_MEDIA_S3_BUCKET: ${{ vars.PRIVATE_MEDIA_S3_BUCKET }}
          PRIVATE_MEDIA_S3_ACCESS_KEY_ID: ${{ secrets.PRIVATE_MEDIA_S3_ACCESS_KEY_ID }}
          PRIVATE_MEDIA_S3_SECRET_ACCESS_KEY: ${{ secrets.PRIVATE_MEDIA_S3_SECRET_ACCESS_KEY }}
          PRIVATE_MEDIA_ALLOWED_ORIGINS: ${{ vars.PRIVATE_MEDIA_ALLOWED_ORIGINS }}
          WORKER_IMAGE: ghcr.io/${{ github.repository }}-worker:${{ inputs.image_sha }}
          PHOTO_PROCESSING_ENABLED: ${{ vars.PHOTO_PROCESSING_ENABLED || 'False' }}
          PHOTO_PROCESSING_PREVIEW_ENABLED: ${{ vars.PHOTO_PROCESSING_PREVIEW_ENABLED || 'False' }}
          PHOTO_PROCESSING_FACE_ENABLED: ${{ vars.PHOTO_PROCESSING_FACE_ENABLED || 'False' }}
          PHOTO_PROCESSING_WORKER_TOKEN: ${{ secrets.PHOTO_PROCESSING_WORKER_TOKEN }}
          PHOTO_PROCESSING_DOWNLOAD_TTL_SECONDS: ${{ vars.PHOTO_PROCESSING_DOWNLOAD_TTL_SECONDS || '120' }}
          PHOTO_PROCESSING_MAX_REQUEST_BYTES: ${{ vars.PHOTO_PROCESSING_MAX_REQUEST_BYTES || '131072' }}
          PHOTO_WORKER_BUILD: ${{ vars.PHOTO_WORKER_BUILD || 'capture-metadata-v1' }}
          PHOTO_WORKER_LEASE_SECONDS: ${{ vars.PHOTO_WORKER_LEASE_SECONDS || '120' }}
          PHOTO_WORKER_PROCESSOR_IDENTITIES: ${{ vars.PHOTO_WORKER_PROCESSOR_IDENTITIES || '1/capture_metadata/2' }}
          PHOTO_WORKER_PROCESSOR_TYPES: ${{ vars.PHOTO_WORKER_PROCESSOR_TYPES || 'selfie_query,face_embedding,capture_metadata,generate_preview' }}
          SELFIE_SEARCH_MAX_UPLOAD_BYTES: ${{ vars.SELFIE_SEARCH_MAX_UPLOAD_BYTES || '20971520' }}
          SELFIE_SEARCH_MAX_PIXELS: ${{ vars.SELFIE_SEARCH_MAX_PIXELS || '25000000' }}
          SELFIE_SEARCH_DOWNLOAD_TTL_SECONDS: ${{ vars.SELFIE_SEARCH_DOWNLOAD_TTL_SECONDS || '120' }}
          SELFIE_SEARCH_EMBEDDING_MODEL: ${{ vars.SELFIE_SEARCH_EMBEDDING_MODEL || 'sface' }}
          SELFIE_SEARCH_EMBEDDING_DIMENSIONS: ${{ vars.SELFIE_SEARCH_EMBEDDING_DIMENSIONS || '128' }}
          SELFIE_SEARCH_COSINE_DISTANCE_THRESHOLD: ${{ vars.SELFIE_SEARCH_COSINE_DISTANCE_THRESHOLD || '0.363' }}
          SELFIE_SEARCH_TEMPORARY_PREFIX: ${{ vars.SELFIE_SEARCH_TEMPORARY_PREFIX || 'selfie-search/' }}
          SELFIE_SEARCH_LIFECYCLE_MAX_AGE_HOURS: ${{ vars.SELFIE_SEARCH_LIFECYCLE_MAX_AGE_HOURS || '24' }}
          GHCR_USERNAME: ${{ secrets.GHCR_USERNAME }}
          GHCR_READ_TOKEN: ${{ secrets.GHCR_READ_TOKEN }}
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_KEY }}
          script_stop: true
          envs: APP_IMAGE,SECRET_KEY,DEBUG,ALLOWED_HOSTS,GUNICORN_WORKERS,GUNICORN_THREADS,GUNICORN_TIMEOUT,GUNICORN_MAX_REQUESTS,GUNICORN_MAX_REQUESTS_JITTER,DB_NAME,DB_USER,DB_PASSWORD,PUBLIC_DOMAIN,PUBLIC_DOMAIN_ALIAS,LETSENCRYPT_EMAIL,MEDIA_STORAGE_BACKEND,MEDIA_S3_ENDPOINT_URL,MEDIA_S3_REGION,MEDIA_S3_PUBLIC_BUCKET,MEDIA_S3_ACCESS_KEY_ID,MEDIA_S3_SECRET_ACCESS_KEY,PHOTO_UPLOAD_ENABLED,PRIVATE_MEDIA_S3_BUCKET,PRIVATE_MEDIA_S3_ACCESS_KEY_ID,PRIVATE_MEDIA_S3_SECRET_ACCESS_KEY,PRIVATE_MEDIA_ALLOWED_ORIGINS,WORKER_IMAGE,PHOTO_PROCESSING_ENABLED,PHOTO_PROCESSING_PREVIEW_ENABLED,PHOTO_PROCESSING_FACE_ENABLED,PHOTO_PROCESSING_WORKER_TOKEN,PHOTO_PROCESSING_DOWNLOAD_TTL_SECONDS,PHOTO_PROCESSING_MAX_REQUEST_BYTES,PHOTO_WORKER_BUILD,PHOTO_WORKER_LEASE_SECONDS,PHOTO_WORKER_PROCESSOR_IDENTITIES,PHOTO_WORKER_PROCESSOR_TYPES,SELFIE_SEARCH_MAX_UPLOAD_BYTES,SELFIE_SEARCH_MAX_PIXELS,SELFIE_SEARCH_DOWNLOAD_TTL_SECONDS,SELFIE_SEARCH_EMBEDDING_MODEL,SELFIE_SEARCH_EMBEDDING_DIMENSIONS,SELFIE_SEARCH_COSINE_DISTANCE_THRESHOLD,SELFIE_SEARCH_TEMPORARY_PREFIX,SELFIE_SEARCH_LIFECYCLE_MAX_AGE_HOURS,GHCR_USERNAME,GHCR_READ_TOKEN,DEPLOYMENT_TARGET
          script: DEPLOY_ROOT=/opt/photo-prjct COMPOSE_PROJECT_NAME=photo-prjct-production sh /opt/photo-prjct/deploy/apply-deployment.sh
