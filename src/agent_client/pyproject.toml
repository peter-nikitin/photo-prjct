[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "findme-photo-client"
version = "0.1.0"
description = "FindMe Photo local upload client and stdio MCP server"
requires-python = ">=3.12"
dependencies = [
  "httpx>=0.28,<1",
  "keyring>=25.7,<26",
  "mcp>=2.3,<3",
]

[project.scripts]
findme = "findme_client.cli:main"

[tool.setuptools.packages.find]
include = ["findme_client*"]
