name: Infrastructure
on:
  push:
    branches: [codex/ssh-reachability-20261107]
permissions:
  contents: read
  id-token: write
jobs:
  verify-ci-lockbox-key:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    environment: infrastructure
    env:
      YC_INFRA_SERVICE_ACCOUNT_ID: ${{ vars.YC_INFRA_SERVICE_ACCOUNT_ID }}
      EXPECTED_PUBLIC_KEY: ${{ vars.INFRA_SSH_PUBLIC_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: python infra/ci/identity.py
      - name: Verify dedicated CI key from Lockbox without server login
        run: |
          python - <<'PY'
          import json,os,subprocess,tempfile
          from urllib.request import Request,urlopen
          from urllib.error import HTTPError
          secret='e6q12ru8opfn2sl91so3'
          headers={'Authorization':'Bearer '+os.environ['YC_TOKEN']}
          with urlopen(Request('https://payload.lockbox.api.cloud.yandex.net/lockbox/v1/secrets/'+secret+'/payload',headers=headers),timeout=20) as response:
              payload=json.load(response)
          entries={entry['key']:entry.get('textValue') for entry in payload['entries']}
          assert entries['ssh_user']=='deploy'
          expected=os.environ['EXPECTED_PUBLIC_KEY'].split()[:2]
          assert entries['ssh_public_key'].split()[:2]==expected
          with tempfile.TemporaryDirectory() as directory:
              filename=directory+'/key'
              descriptor=os.open(filename,os.O_CREAT|os.O_WRONLY,0o600)
              with os.fdopen(descriptor,'w') as output:output.write(entries['ssh_private_key'])
              derived=subprocess.check_output(['ssh-keygen','-y','-f',filename],text=True).strip()
              assert derived.split()[:2]==expected
              fingerprint=subprocess.check_output(['ssh-keygen','-lf',filename],text=True).strip()
              print('CI_KEY_VERIFIED '+fingerprint)
          url='https://lockbox.api.cloud.yandex.net/lockbox/v1/secrets/'+secret+':listAccessBindings'
          try:
              with urlopen(Request(url,headers=headers),timeout=20) as response:json.load(response)
              print('TECH_SECRET_BINDINGS_READ_ALLOWED')
          except HTTPError as error:
              print('TECH_SECRET_BINDINGS_READ_HTTP '+str(error.code))
              raise SystemExit(1)
          print('No VM modified; operator private key was not requested or transferred to GitHub.')
          PY
