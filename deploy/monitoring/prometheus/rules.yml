groups:
- name: findme-photo
  interval: 1m
  rules:
  - alert: PublicServiceUnavailable
    expr: last_over_time({{public_success}}[6m]) < 0.5
    for: 10m
    labels:
      project: findme-photo
      severity: critical
      notification: actionable
      incident: public-service
    annotations:
      summary: Public HTTPS attempts have failed throughout ten minutes.
  - alert: PublicObservationsMissing
    expr: absent_over_time({{public_success}}[10m])
    for: 5m
    labels:
      project: findme-photo
      severity: critical
    annotations:
      summary: Public HTTPS observations are missing; availability is unconfirmed.
  - alert: TLSCertificateExpiring
    expr: min_over_time({{tls_days}}[10m]) < 14
    for: 5m
    labels:
      project: findme-photo
      severity: critical
    annotations:
      summary: TLS certificate lifetime is below fourteen days.
  - alert: VMTelemetryMissing
    expr: absent_over_time({{uptime}}[5m]) or absent_over_time({{http_requests}}[5m])
    for: 5m
    labels:
      project: findme-photo
      severity: critical
    annotations:
      summary: Host or private HTTP observations are missing; public health is unconfirmed.
  - alert: DiskSpaceCritical
    expr: ({{disk_percent}}) < 10 or {{disk_bytes}} < 5368709120
    for: 10m
    labels:
      project: findme-photo
      severity: critical
      notification: actionable
      incident: canonical-capacity
    annotations:
      summary: System filesystem free capacity is below ten percent or five GiB.
  - alert: MemoryPressure
    expr: max_over_time(({{memory}})[15m:1m]) < 10
    for: 5m
    labels:
      project: findme-photo
      severity: critical
    annotations:
      summary: Available memory is below ten percent throughout fifteen minutes.
  - alert: CPUPressure
    expr: min_over_time(({{cpu}})[15m:1m]) > 90
    for: 5m
    labels:
      project: findme-photo
      severity: critical
    annotations:
      summary: CPU utilization is above ninety percent throughout fifteen minutes.
  - alert: Application5xxDegradation
    expr: ({{http_errors}} / {{http_total}} > 0.2) and ({{http_total}} >= 5)
    for: 5m
    labels:
      project: findme-photo
      severity: critical
      notification: actionable
      incident: public-service
    annotations:
      summary: HTTP 5xx exceeds twenty percent with at least five requests in five
        minutes.
  - alert: CommerceWorkerUnavailable
    expr: max_over_time({{commerce_alive}}[5m]) < 0.5
    for: 5m
    labels:
      project: findme-photo
      severity: critical
    annotations:
      summary: Commerce liveness observations are zero throughout five minutes.
  - alert: CommerceObservationsMissing
    expr: absent_over_time({{commerce_alive}}[5m]) or absent_over_time({{commerce_age}}[5m])
    for: 5m
    labels:
      project: findme-photo
      severity: critical
    annotations:
      summary: Commerce observations are missing; inspect collector, web and database.
  - alert: CommerceReadyWorkOverdue
    expr: '{{commerce_age}} > 300'
    for: 5m
    labels:
      project: findme-photo
      severity: critical
      notification: actionable
      incident: commerce-processing
    annotations:
      summary: Commerce ready work is older than three hundred seconds.
- name: findme-workers
  interval: 1m
  rules:
  - alert: WorkerReadyWorkOverdue
    expr: ({{worker_queue_fresh}}) and on(pool) ({{worker_cloud_fresh}}) and on(pool)
      (worker_pool_oldest_claimable_age_seconds > 300)
    for: 5m
    labels:
      project: findme-photo
      severity: warning
      notification: actionable
      incident: photo-processing
    annotations:
      summary: Worker-ready work is older than three hundred seconds.
  - alert: WorkerPoolSaturated
    expr: ({{worker_queue_fresh}}) and on(pool) (min_over_time(worker_pool_queue_observation_available[90s])
      == 1) and on(pool) ({{worker_cloud_fresh}}) and on(pool) ({{worker_publisher_fresh}})
      and on(pool) (worker_pool_running_instances >= 1) and on(pool) (worker_pool_oldest_claimable_age_seconds
      > 300) and on(pool) (idelta(worker_pool_oldest_claimable_age_seconds[90s])
      > 0) and on(pool) (resets(worker_pool_oldest_claimable_age_seconds[90s]) ==
      0)
    for: 5m
    labels:
      project: findme-photo
      severity: critical
    annotations:
      summary: A cap-one worker pool has sustained growing ready-work age.
  - alert: WorkerQueueObservationMissing
    expr: ({{worker_pool_universe}}) unless on(pool) ({{worker_queue_fresh}})
    for: 5m
    labels:
      project: findme-photo
      severity: critical
    annotations:
      summary: Worker queue observations are missing, unavailable or stale.
  - alert: WorkerCloudObservationMissing
    expr: ({{worker_pool_universe}}) unless on(pool) ({{worker_cloud_fresh}})
    for: 5m
    labels:
      project: findme-photo
      severity: critical
    annotations:
      summary: Worker cloud membership observations are missing or stale.
  - alert: WorkerNativePublisherMissing
    expr: ({{worker_pool_universe}}) unless on(pool) ({{worker_publisher_fresh}})
    for: 5m
    labels:
      project: findme-photo
      severity: critical
    annotations:
      summary: Native worker metric publication is missing or stale.
  - alert: WorkerHostDiagnosticsMissing
    expr: ((worker_pool_expected_instances > 0) and on(pool) ({{worker_cloud_fresh}}))
      unless on(pool) (({{worker_current_nodes}}) and on(pool, instance_id, zone_id)
      (worker_host_observation_missing == 0) and on(pool, instance_id, zone_id)
      (worker_host_observation_fresh == 1) and on(pool, instance_id, zone_id) (worker_host_collection_available
      == 1))
    for: 5m
    labels:
      project: findme-photo
      severity: critical
    annotations:
      summary: Expected worker host diagnostics are missing or unavailable.
- name: findme-image-origin
  interval: 1m
  rules:
  - alert: ImageOriginTelemetryMissing
    expr: sum(absent_over_time({{image_2xx}}[5m])) or sum(absent_over_time({{image_proxy_requests}}[5m])) or sum(absent_over_time({{image_mem_available}}[5m]))
    for: 5m
    labels:
      project: findme-photo
      severity: critical
    annotations:
      summary: Image-origin host, Nginx or imgproxy observations are missing.
  - alert: ImageOrigin5xxDegradation
    expr: ({{image_5xx_ratio}})
    for: 2m
    labels:
      project: findme-photo
      severity: critical
      notification: actionable
      incident: image-delivery
    annotations:
      summary: Image-origin 5xx exceeds 2 percent with at least 20 requests in five minutes.
  - alert: ImageOriginRateLimited
    expr: ({{image_429_ratio}})
    for: 2m
    labels:
      project: findme-photo
      severity: warning
      notification: actionable
      incident: image-delivery
    annotations:
      summary: Image-origin 429 exceeds 1 percent with at least 20 requests in five minutes.
  - alert: ImageOriginCPUPressure
    expr: ({{image_cpu}}) > 90
    for: 10m
    labels:
      project: findme-photo
      severity: warning
    annotations:
      summary: Image-origin VM CPU has exceeded 90 percent for ten minutes.
  - alert: ImageOriginMemoryPressure
    expr: ({{image_mem_free_percent}}) < 15
    for: 10m
    labels:
      project: findme-photo
      severity: warning
    annotations:
      summary: Image-origin VM has less than 15 percent available memory.
  - alert: ImageOriginDiskSpaceCritical
    expr: ({{image_disk_free_percent}}) < 10 or {{image_disk_free}} < 5368709120
    for: 10m
    labels:
      project: findme-photo
      severity: critical
      notification: actionable
      incident: image-capacity
    annotations:
      summary: Image-origin root filesystem has less than 10 percent or five GiB free.
  - alert: ImageOriginAuthRejections
    expr: increase({{image_auth_rejected}}[5m]) > 50
    for: 2m
    labels:
      project: findme-photo
      severity: warning
    annotations:
      summary: Image-origin rejects more than ten unauthenticated requests per minute.
  - alert: ImgproxyErrors
    expr: sum(increase({{image_proxy_errors}}[5m])) > 0
    for: 5m
    labels:
      project: findme-photo
      severity: warning
    annotations:
      summary: imgproxy queue or timeout errors are rising; inspect processing and source access.
  - alert: ImgproxyLatencyHigh
    expr: ({{image_proxy_p95}} > 1.5) and ({{image_proxy_requests_5m}} >= 20)
    for: 5m
    labels:
      project: findme-photo
      severity: warning
    annotations:
      summary: imgproxy five-minute p95 has exceeded 1.5 seconds with enough requests.
- name: findme-postgres
  interval: 1m
  rules:
  - alert: DatabaseUnavailableToDjango
    expr: (max_over_time(findme_db_usable[2m]) == 0) and on() ((time() - findme_db_check_timestamp_seconds) >= 0 and (time() - findme_db_check_timestamp_seconds) < 150)
    for: 3m
    labels:
      project: findme-photo
      severity: critical
      notification: actionable
      incident: database
    annotations:
      summary: Application SQL checks cannot use PostgreSQL for three minutes.
  - alert: DatabaseConnectionExhaustion
    expr: (sum(findme_db_sessions) / findme_db_usable_connections >= 0.9) and on() ((time() - findme_db_check_timestamp_seconds) < 150) and on() (((findme_db_usable == 0) or ((sum(increase(findme_http_requests_total{status_class="5xx",route!~"processing_.*"}[5m])) >= 5) and on() (count((time() - timestamp(findme_http_requests_total{status_class="5xx",route!~"processing_.*"})) < 150) > 0))) or ((findme_db_blocked_sessions >= 3) and (findme_db_lock_wait_oldest_seconds >= 300))) and on() ((time() - timestamp(findme_db_usable_connections)) < 150) and on() (count((time() - timestamp(findme_db_sessions)) < 150) == 3)
    for: 10m
    labels:
      project: findme-photo
      severity: critical
      notification: actionable
      incident: database
    annotations:
      summary: Database connections are exhausted with measured service impact.
  - alert: DatabaseLockDegradation
    expr: (((findme_db_blocked_sessions > 0) and (findme_db_lock_wait_oldest_seconds >= 300)) or (findme_db_oldest_transaction_seconds{state="idle_in_transaction"} >= 300)) and on() ((time() - findme_db_check_timestamp_seconds) < 150) and on() (((sum(increase(findme_http_requests_total{status_class="5xx",route!~"processing_.*"}[5m])) >= 5) and on() (count((time() - timestamp(findme_http_requests_total{status_class="5xx",route!~"processing_.*"})) < 150) > 0)) or ((commerce_oldest_ready_age_seconds{check="canonical-commerce"} > 300) and on() ((time() - timestamp(commerce_oldest_ready_age_seconds{check="canonical-commerce"})) < 150)) or (sum((worker_pool_oldest_claimable_age_seconds > 300) and on(pool) (worker_pool_queue_observation_available == 1) and on(pool) ((time() - worker_pool_queue_observation_timestamp_seconds) >= 0) and on(pool) ((time() - worker_pool_queue_observation_timestamp_seconds) < 90) and on(pool) ((time() - timestamp(worker_pool_oldest_claimable_age_seconds)) < 90)) > 0)) and on() ((time() - timestamp(findme_db_blocked_sessions)) < 150)
    for: 5m
    labels:
      project: findme-photo
      severity: critical
      notification: actionable
      incident: database
    annotations:
      summary: Sustained database locks or idle transactions coincide with service impact.
  - alert: DatabaseTransactionFailures
    expr: (rate(pg_stat_database_xact_rollback{job="findme-postgres",datname="app"}[5m]) / (rate(pg_stat_database_xact_commit{job="findme-postgres",datname="app"}[5m]) + rate(pg_stat_database_xact_rollback{job="findme-postgres",datname="app"}[5m])) > 0.2) and (rate(pg_stat_database_xact_commit{job="findme-postgres",datname="app"}[5m]) + rate(pg_stat_database_xact_rollback{job="findme-postgres",datname="app"}[5m]) >= 1) and on() ((time() - timestamp(pg_stat_database_xact_commit{job="findme-postgres",datname="app"})) < 150) and on() ((time() - timestamp(pg_stat_database_xact_rollback{job="findme-postgres",datname="app"})) < 150)
    for: 10m
    labels:
      project: findme-photo
      severity: warning
    annotations:
      summary: Database rollback share is elevated; compare with customer and worker errors.
  - alert: DatabaseFreezeDanger
    expr: (findme_db_max_relation_xid_age / findme_db_autovacuum_freeze_max_age >= 0.8) and on() ((time() - findme_db_check_timestamp_seconds) < 150) and on() ((time() - timestamp(findme_db_max_relation_xid_age)) < 150)
    for: 30m
    labels:
      project: findme-photo
      severity: critical
      notification: actionable
      incident: database
    annotations:
      summary: Oldest relation XID age exceeds eighty percent of the freeze limit.
  - alert: DatabaseCollectorFailure
    expr: (pg_up{job="findme-postgres"} == 0) and on() ((time() - timestamp(pg_up{job="findme-postgres"})) < 150)
    for: 5m
    labels:
      project: findme-photo
      severity: warning
    annotations:
      summary: PostgreSQL exporter cannot connect; application database state is independent.
  - alert: DatabaseTelemetryMissing
    expr: sum(absent_over_time(pg_up{job="findme-postgres"}[4m])) or sum(absent_over_time(findme_db_usable[4m])) or sum(absent_over_time(findme_db_wal_bytes_total[4m]))
    for: 5m
    labels:
      project: findme-photo
      severity: warning
    annotations:
      summary: PostgreSQL observations are missing; database health is unknown.
