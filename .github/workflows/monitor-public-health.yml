name: Monitor public health

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
    inputs:
      target:
        description: Controlled public health target for validation metrics
        required: true
        default: https://findme-photo.ru/health/
        type: choice
        options:
          - https://findme-photo.ru/health/
          - https://example.invalid/health/

jobs:
  probe:
    name: Probe public health
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Probe public health and write metrics
        env:
          MONITOR_TARGET: ${{ github.event_name == 'schedule' && 'https://findme-photo.ru/health/' || inputs.target }}
          MONITOR_CHECK: ${{ github.event_name == 'schedule' && 'canonical-health' || 'validation-health' }}
          YANDEX_CLOUD_FOLDER_ID: ${{ vars.YANDEX_CLOUD_FOLDER_ID }}
        run: |
          python scripts/run-with-environment-secrets.py \
            \
            --consumer public-monitor \
            --identity github-oidc \
            -- deploy/run-remote.sh public-monitor
