[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["src/backend/picflow/migrations"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "DJ"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.12"
files = ["src/backend", "src/worker/photo_worker"]
exclude = ["src/backend/picflow/migrations"]
check_untyped_defs = true
ignore_missing_imports = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
pythonpath = [".", "src/backend", "src/worker"]
testpaths = ["src/backend", "src/worker/tests", "tests"]
addopts = "--strict-config --strict-markers --import-mode=importlib"
markers = [
  "face_models: requires locally supplied YuNet and SFace model files",
]

[tool.coverage.run]
branch = true
source = [
    "src/backend/config",
    "src/backend/ingestion",
    "src/backend/picflow",
    "src/backend/processing",
    "src/backend/selfie_search",
    "src/worker/photo_worker",
]
omit = ["*/migrations/*", "*/tests/*", "*/asgi.py", "*/wsgi.py"]

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 75
