{% load search_feedback %}
<form class="gallery-result-feedback" data-result-feedback{% if reversible_feedback %} data-reversible-feedback{% endif %} action="{{ feedback_url }}" method="post">
  {% csrf_token %}
  <input name="submission_id" type="hidden" value="{% feedback_submission_id %}">
  {% if public_token %}<input name="public_token" type="hidden" value="{{ public_token }}">{% endif %}
  <input name="photo_id" type="hidden" value="{{ photo_id }}">
  {% if bib_number %}<input name="bib" type="hidden" value="{{ bib_number }}">{% endif %}
  <button class="gallery-feedback-button" type="submit"{% if reversible_feedback %} aria-pressed="{% if photo_id in reported_photo_ids %}true{% else %}false{% endif %}"{% elif photo_id in reported_photo_ids %} hidden{% endif %}>Это не я</button>
  {% if not reversible_feedback %}<span data-feedback-saved role="status"{% if photo_id in reported_photo_ids %}{% else %} hidden{% endif %}>Отметка сохранена</span>{% endif %}
  <span data-feedback-error role="alert" hidden>Не удалось сохранить. Попробуйте ещё раз.</span>
</form>
