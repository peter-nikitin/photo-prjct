name: photo-prjct-visual

services:
  postgres:
    image: pgvector/pgvector:0.8.6-pg16-trixie@sha256:c8483555ce48101872f888c1df8a895ff689d6c7c7a5f7ac266475f9dfe89e0b
    environment:
      POSTGRES_DB: app
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d app"]
      interval: 2s
      timeout: 5s
      retries: 15

  visual-tests:
    image: ${VISUAL_TEST_IMAGE:-photo-prjct-visual-deps:local}
    build:
      context: .
      dockerfile: Dockerfile.visual-tests
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SECRET_KEY: visual-tests-not-a-secret
      DEBUG: "False"
      ALLOWED_HOSTS: localhost,127.0.0.1
      DB_NAME: app
      DB_USER: app
      DB_PASSWORD: app
      DB_HOST: postgres
      DB_PORT: "5432"
      PYTHONPATH: .:src/backend
      NODE_PATH: /opt/visual-test-deps/node_modules
      DJANGO_SETTINGS_MODULE: tests.visual.settings
      CI: ${CI:-false}
      PRIVATE_MEDIA_S3_BUCKET: visual-private-media
      PRIVATE_MEDIA_S3_ACCESS_KEY_ID: visual-private-access
      PRIVATE_MEDIA_S3_SECRET_ACCESS_KEY: visual-private-secret
      PRIVATE_MEDIA_ALLOWED_ORIGINS: https://photos.example.test
      SELFIE_FEEDBACK_S3_BUCKET: visual-feedback-media
      SELFIE_FEEDBACK_S3_ACCESS_KEY_ID: visual-feedback-access
      SELFIE_FEEDBACK_S3_SECRET_ACCESS_KEY: visual-feedback-secret
      SELFIE_FEEDBACK_KMS_KEY_ID: visual-feedback-kms
    volumes:
      - ./src:/workspace/src:ro
      - ./tests:/workspace/tests:ro
      - ./package.json:/workspace/package.json:ro
      - ./playwright.config.js:/workspace/playwright.config.js:ro
      - ./tests/visual/visual.spec.js-snapshots:/workspace/tests/visual/visual.spec.js-snapshots
      - ./playwright-report:/workspace/playwright-report
      - ./test-results:/workspace/test-results
