name: Infrastructure
on:
  push:
    branches: [codex/ssh-reachability-20261107]
permissions:
  contents: read
  id-token: write
jobs:
  verify-reviewed-ssh-helpers:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    environment: infrastructure
    env:
      YC_INFRA_SERVICE_ACCOUNT_ID: ${{ vars.YC_INFRA_SERVICE_ACCOUNT_ID }}
      EXPECTED_PUBLIC_KEY: ${{ vars.INFRA_SSH_PUBLIC_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 209c6179e3eac280c4e8d7b224a902f8e0fed10e
          persist-credentials: false
      - name: Exchange infrastructure OIDC identity
        run: python infra/ci/identity.py
      - name: Verify actual release credential and host-key helpers read-only
        run: |
          set -euo pipefail
          python infra/ci/lockbox.py e6q12ru8opfn2sl91so3 deploy "$EXPECTED_PUBLIC_KEY" "$RUNNER_TEMP/findme-reviewed-key"
          test "$(stat -c %a "$RUNNER_TEMP/findme-reviewed-key")" = 600
          ssh-keygen -lf "$RUNNER_TEMP/findme-reviewed-key"
          python infra/ci/known_hosts.py fv4lac9q76a3m7209gjp 158.160.130.235 "$RUNNER_TEMP/findme-reviewed-hosts"
          test -s "$RUNNER_TEMP/findme-reviewed-hosts"
          echo 'Reviewed Lockbox credential helper and authenticated cloud-init host-key parser verified. No VM login or mutation performed.'
      - name: Remove temporary credential files
        if: always()
        run: rm -f "$RUNNER_TEMP/findme-reviewed-key" "$RUNNER_TEMP/findme-reviewed-hosts"
